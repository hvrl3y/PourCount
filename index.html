<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Tallypour</title>
<meta name="apple-mobile-web-app-title" content="Tallypour">
<meta name="description" content="Tallypour: bar inventory and liquor cost tracking. Free during early access.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  color-scheme:dark;
  --bg:#000;--cell:#1c1c1e;--cell2:#2c2c2e;--sep:rgba(84,84,88,.6);
  --label:#fff;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);
  --tint:#ff9f0a;--tintText:#000;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--blue:#0a84ff;
  --fill:rgba(118,118,128,.24);--bar:rgba(18,18,20,.82);--shadow:rgba(0,0,0,.5);
  --glass:rgba(255,255,255,.07);--glassLine:rgba(235,235,245,.38);--cap:#48484a;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#f2f2f7;--cell:#fff;--cell2:#e5e5ea;--sep:rgba(60,60,67,.22);
  --label:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);
  --tint:#c46a00;--tintText:#fff;--green:#248a3d;--red:#d70015;--orange:#c46a00;--blue:#007aff;
  --fill:rgba(118,118,128,.12);--bar:rgba(249,249,249,.86);--shadow:rgba(0,0,0,.18);
  --glass:rgba(255,255,255,.7);--glassLine:rgba(60,60,67,.45);--cap:#3a3a3c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label)}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* nav bar */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:var(--st);height:calc(44px + var(--st));display:flex;align-items:center;justify-content:center;background:transparent;transition:background .2s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav .t{font-weight:600;font-size:17px;opacity:0;transition:opacity .15s}
.nav.solid .t{opacity:1}
.nav .r{position:absolute;right:8px;bottom:0;height:44px;display:flex;align-items:center}
.navbtn{color:var(--tint);font-size:17px;padding:0 8px;height:44px;display:flex;align-items:center;gap:4px}
.navbtn svg{width:24px;height:24px}

main{padding:calc(44px + var(--st)) env(safe-area-inset-right,0px) calc(96px + var(--sb)) env(safe-area-inset-left,0px);max-width:640px;margin:0 auto}
h1.large{font-size:34px;font-weight:700;letter-spacing:.3px;margin:2px 16px 8px}
.sub{color:var(--sec);font-size:15px;margin:-4px 16px 12px}

/* grouped lists */
.sec-h{color:var(--sec);font-size:13px;text-transform:uppercase;margin:22px 32px 7px;letter-spacing:-.05px}
.sec-f{color:var(--sec);font-size:13px;margin:7px 32px 0;line-height:1.35}
.group{background:var(--cell);border-radius:10px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;min-height:44px;padding:0 16px;position:relative;gap:10px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.tap:active{background:var(--cell2)}
.row .main{flex:1;min-width:0;padding:10px 0}
.row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--sec);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .val{color:var(--sec);text-align:right;white-space:nowrap}
.row .val b{color:var(--label);font-weight:500;display:block}
.row .val small{font-size:13px}
.chev{width:8px;height:13px;flex:none;opacity:.35}
.row label{flex:none;min-width:120px}
.row input,.row select{flex:1;min-width:0;border:0;background:none;text-align:right;outline:none;padding:11px 0;color:var(--label);font-size:17px}
.row input::placeholder{color:var(--ter)}
.row .pre{margin-left:auto;margin-right:-8px;color:var(--sec);flex:none}
.row input.money{flex:none;width:5ch;text-align:left}
.row input:focus{color:var(--label)}
.row select{-webkit-appearance:none;appearance:none;direction:rtl}
.row .unit{color:var(--ter);font-size:15px;flex:none}
.row.center{justify-content:center;color:var(--tint)}
.row.danger{justify-content:center;color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ic{width:29px;height:29px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.hi{padding-left:14px;gap:12px}
.row+.row.hi::before{left:55px}
.row.hi label{min-width:96px}
.mi{display:inline-flex;vertical-align:-2px;margin-right:5px}
.mi svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg button{display:flex;align-items:center;justify-content:center;gap:5px}
.seg button .mi{margin:0}
.shelf{margin:0 0 6px}
.shelf-h{display:flex;align-items:center;gap:8px;margin:18px 16px 4px 32px;color:var(--sec);font-size:13px;text-transform:uppercase}
.shelf-h b{font-weight:400;flex:1}
.shelf-h button{color:var(--tint);text-transform:none;font-size:15px;height:36px;padding:0 6px}
.shelf-row{display:flex;align-items:stretch;overflow-x:auto;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:200px}
.shelf-row::-webkit-scrollbar{display:none}
.btl{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.btl .g{height:142px;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.btl .g svg{display:block;overflow:visible}
.btl .edge{height:10px;width:100%;background:linear-gradient(#6b4a2d,#432d1a);box-shadow:0 3px 6px rgba(0,0,0,.45)}
html[data-theme=light] .btl .edge{background:linear-gradient(#caa47c,#9c734c);box-shadow:0 3px 6px rgba(0,0,0,.18)}
.btl .lbl{width:74px;text-align:center;margin-top:7px;font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px}
.btl .bm{font-size:11px;color:var(--sec);margin-top:2px;white-space:nowrap}
.btl .badge{position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.btl .badge svg{width:12px;height:12px}
.btl .sealed{position:absolute;top:6px;left:6px;font-size:11px;font-weight:600;background:var(--fill);color:var(--label);border-radius:8px;padding:1px 6px}
.btl:active .g svg{transform:scale(.96)}
.btl.empty-slot{width:150px;color:var(--ter);font-size:13px;cursor:default}
.btl.empty-slot .g{align-items:center;border:1.5px dashed var(--ter);border-bottom:0;border-radius:10px 10px 0 0;width:136px}
.arranging .btl:not(.empty-slot) .g{animation:jig .32s ease-in-out infinite alternate}
.arranging .btl:nth-child(2n) .g{animation-delay:-.16s}
@keyframes jig{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.btl.ghost{opacity:.25}
.drag-float{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-70%) scale(1.12);filter:drop-shadow(0 10px 16px rgba(0,0,0,.45));transition:none}
.toolbar{display:flex;gap:8px;margin:10px 16px 0}
.toolbar .btn{margin:0;height:40px;font-size:15px;flex:1;width:auto}
.hintbar{margin:10px 16px 0;padding:10px 14px;border-radius:10px;background:var(--fill);color:var(--sec);font-size:14px;line-height:1.35}
.shapes{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.shapes::-webkit-scrollbar{display:none}
.shape{flex:none;width:62px;height:84px;border-radius:10px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;font-size:11px;color:var(--sec);gap:3px}
.shape.on{background:var(--tint);color:var(--tintText)}
.thumb{width:30px;height:46px;flex:none;display:flex;align-items:flex-end;justify-content:center}
.look{display:flex;gap:14px;align-items:center;padding:12px 16px}
.look .art{width:64px;height:120px;display:flex;align-items:flex-end;justify-content:center;flex:none}
.look .txt{flex:1;min-width:0}
.look .txt b{display:block;font-weight:600}
.look .txt span{display:block;color:var(--sec);font-size:14px;margin-top:2px}
.lbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lbtn{height:34px;padding:0 12px;border-radius:17px;background:var(--fill);color:var(--tint);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.lbtn.red{color:var(--red)}
.lbtn[hidden]{display:none}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:var(--fill);color:var(--tint);font-weight:600;margin:10px 16px 0;width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:none;flex-direction:column}
.overlay.show{display:flex}
.ov-head{display:flex;align-items:center;justify-content:space-between;height:52px;padding:var(--st) 8px 0;flex:none}
.ov-head button{color:#ff9f0a;padding:0 10px;height:44px;font-size:17px}
.ov-head .t{font-weight:600}
.scan-stage{flex:1;position:relative;overflow:hidden}
.scan-stage video{width:100%;height:100%;object-fit:cover}
.scan-box{position:absolute;left:12%;right:12%;top:38%;height:22%;border:3px solid #ff9f0a;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scan-line{position:absolute;left:14%;right:14%;top:49%;height:2px;background:#ff453a;box-shadow:0 0 8px #ff453a}
.scan-msg{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:15px;padding:0 24px;text-shadow:0 1px 3px #000}
.ov-foot{padding:12px 16px calc(14px + var(--sb));display:flex;gap:8px;flex:none;background:#000}
.ov-foot input{flex:1;height:44px;border-radius:10px;border:0;background:#2c2c2e;color:#fff;padding:0 12px;font-size:17px;outline:none}
.ov-foot button{height:44px;padding:0 16px;border-radius:10px;background:#ff9f0a;color:#000;font-weight:600}
.frame-stage{flex:1;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;position:relative}
.frame-box{position:relative;overflow:hidden;background:#111;border-radius:6px}
.frame-box img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.frame-box svg{position:absolute;inset:0;pointer-events:none}
.frame-tip{text-align:center;color:#ccc;font-size:14px;padding:8px 24px}
.frame-zoom{display:flex;align-items:center;gap:10px;padding:4px 24px 0;color:#ccc;font-size:13px}
.frame-zoom input{flex:1;accent-color:#ff9f0a}
.legend{display:flex;gap:14px;color:var(--sec);font-size:13px;margin:-6px 16px 12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ok{color:var(--green)!important}.warn{color:var(--orange)!important}.bad{color:var(--red)!important}
.bg-ok{background:var(--green)}.bg-warn{background:var(--orange)}.bg-bad{background:var(--red)}.bg-none{background:var(--ter)}

/* search */
.search{margin:0 16px 4px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px}
.search svg{width:16px;height:16px;opacity:.5;flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--sec)}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 16px;position:relative}
.seg button{flex:1;height:36px;border-radius:7px;font-size:13px;font-weight:500;color:var(--label);transition:background .15s}
.seg button.on{background:var(--cell2);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
html[data-theme=light] .seg button.on{background:#fff}

/* chips */
.chips{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:14px}
.chip.on{background:var(--tint);color:var(--tintText)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--sep);border-radius:10px;overflow:hidden;margin:0 16px}
.stats>div{background:var(--cell);padding:10px 14px}
.stats .k{font-size:12px;color:var(--sec);text-transform:uppercase;letter-spacing:.2px}
.stats .v{font-size:22px;font-weight:600;margin-top:2px}
.hero{margin:0 16px;background:var(--cell);border-radius:10px;padding:14px 16px}
.hero .k{font-size:13px;color:var(--sec)}
.hero .v{font-size:34px;font-weight:700;letter-spacing:.2px}
.hero .m{font-size:14px;color:var(--sec);margin-top:2px}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--tint);border-radius:2px}

.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:12px;background:var(--tint);color:var(--tintText);font-weight:600;margin:0 16px;width:calc(100% - 32px);font-size:17px}
.btn.gray{background:var(--fill);color:var(--tint)}
.btn:active{opacity:.75}
.empty{text-align:center;color:var(--sec);padding:40px 32px}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:10px}
.empty h3{color:var(--label);margin:0 0 6px;font-size:20px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 0 calc(var(--sb) + 4px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--sec);min-height:44px}
html[data-theme=light] .tabbar button{color:rgba(60,60,67,.6)}
.tabbar svg{width:26px;height:26px}
.tabbar button.on{color:var(--tint)!important}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;height:calc(100% - var(--st) - 12px);background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:0 -6px 30px var(--shadow)}
html[data-theme=dark] .sheet{background:#1c1c1e}
html[data-theme=dark] .sheet .group,html[data-theme=dark] .sheet .stats>div,html[data-theme=dark] .sheet .hero{background:#2c2c2e}
html[data-theme=dark] .sheet .row.tap:active{background:#3a3a3c}
html[data-theme=dark] .sheet .seg button.on{background:#636366}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:6px auto 0;flex:none}
.sh-head button.dis{opacity:.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sh-head{display:flex;align-items:center;height:48px;padding:0 8px;flex:none}
.sh-head .t{flex:1;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.sh-head button{color:var(--tint);padding:0 8px;height:44px;min-width:70px}
.sh-head button.l{text-align:left}.sh-head button.r{text-align:right;font-weight:600}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(30px + var(--sb))}

/* count sheet */
.gauge{display:flex;align-items:center;gap:16px;margin:4px 16px 16px;background:var(--cell);border-radius:12px;padding:12px 16px}
html[data-theme=dark] .sheet .gauge{background:#2c2c2e}
.gauge svg{width:46px;height:108px;flex:none}
.gauge .big{font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1}
.gauge .big span{font-size:20px;font-weight:600;color:var(--sec)}
.gauge .m{color:var(--sec);font-size:15px;margin-top:6px}
.bigin{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 16px 4px;background:var(--cell);border-radius:12px;padding:6px 16px}
html[data-theme=dark] .sheet .bigin{background:#2c2c2e}
.bigin input{width:100%;text-align:center;border:0;background:none;outline:none;font-size:44px;font-weight:600;padding:6px 0;font-variant-numeric:tabular-nums}
.bigin input::placeholder{color:var(--ter)}
.bigin span{color:var(--sec);font-size:20px}
.hint{color:var(--sec);font-size:13px;text-align:center;margin:4px 24px 0}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;overflow:hidden;flex:none}
.stepper button{width:48px;height:42px;font-size:22px;color:var(--label);line-height:1}
.stepper input{width:44px;text-align:center;border:0;background:none;outline:none;font-size:17px;font-weight:600;padding:0;color:var(--label)}
input[type=range]{width:100%;accent-color:var(--tint);height:32px}
.ticks{display:flex;justify-content:space-between;color:var(--sec);font-size:12px;padding:0 4px}
.check{width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.check.done{background:var(--green)}
.check.todo{border:1.5px solid var(--ter)}
.check svg{width:13px;height:13px}
.catlabel{font-size:12px;color:var(--sec);background:var(--fill);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* action sheet + toast */
.as{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--sb));z-index:61;max-width:480px;margin:0 auto;transform:translateY(130%);transition:transform .28s cubic-bezier(.2,.9,.25,1)}
.as.show{transform:none}
.as .box{background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
html[data-theme=dark] .as .box{background:rgba(44,44,46,.95)}
.as .msg{text-align:center;color:var(--sec);font-size:13px;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.as button{display:block;width:100%;height:56px;font-size:20px;color:var(--blue)}
.as .box button+button{border-top:.5px solid var(--sep)}
.as button.d{color:var(--red)}
.as .cancel{background:var(--cell);border-radius:14px;font-weight:600}
html[data-theme=dark] .as .cancel{background:#2c2c2e}
.asscrim{z-index:60}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 76px);transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--cell2);color:var(--label);padding:10px 18px;border-radius:20px;font-size:15px;font-weight:500;transition:all .25s;pointer-events:none;box-shadow:0 6px 20px var(--shadow);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
textarea.code{width:calc(100% - 32px);margin:0 16px;height:220px;border-radius:10px;border:0;background:var(--cell);padding:12px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--label);resize:none;outline:none}
html[data-theme=dark] .sheet textarea.code{background:#2c2c2e}
.spacer{height:16px}
</style>
</head>
<body>
<div class="nav" id="nav"><div class="t" id="navT"></div><div class="r" id="navR"></div></div>
<main id="app"></main>
<nav class="tabbar" id="tabbar"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetIn" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>
<div class="scrim asscrim" id="asScrim"></div>
<div class="as" id="as"></div>
<div class="overlay" id="scanner" role="dialog" aria-label="Scan barcode">
  <div class="ov-head"><button data-a="scanClose">Cancel</button><div class="t">Scan Barcode</div><button style="visibility:hidden">Cancel</button></div>
  <div class="scan-stage"><video id="scanVideo" playsinline muted></video><div class="scan-box"></div><div class="scan-line"></div><div class="scan-msg" id="scanMsg">Line up the barcode inside the box</div></div>
  <div class="ov-foot"><input id="scanManual" inputmode="numeric" placeholder="Or type the barcode number" autocomplete="off"><button data-a="scanManualGo">Use</button></div>
</div>
<div class="overlay" id="framer" role="dialog" aria-label="Frame photo">
  <div class="ov-head"><button data-a="frameCancel">Cancel</button><div class="t">Fit the Bottle</div><button data-a="frameUse" style="font-weight:600">Use Photo</button></div>
  <div class="frame-tip">Drag the photo so the bottle fills the outline.</div>
  <div class="frame-stage" id="frameStage"><div class="frame-box" id="frameBox"><img id="frameImg" alt=""></div></div>
  <div class="frame-zoom">Zoom <input id="frameZoom" type="range" min="0.3" max="4" step="0.01" value="1"></div>
  <div style="height:calc(18px + var(--sb))"></div>
</div>
<input type="file" id="fileTake" accept="image/*" capture="environment" hidden>
<input type="file" id="filePick" accept="image/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const OZ = 29.5735;
const KEY = "pourcount.v1";
const CATS = {"Vodka":.95,"Gin":.95,"Rum":.95,"Tequila":.95,"Mezcal":.95,"Whiskey":.95,"Brandy":.95,"Liqueur":1.06,"Cream Liqueur":1.07,"Vermouth":1.02,"Wine":.99,"Other":.97};
const SIZES = [[375,"375 ml"],[750,"750 ml"],[1000,"1 L"],[1750,"1.75 L"]];
const TAPER_K = 0.35; // neck radius as a fraction of body radius for tape model

/* ---------- state ---------- */
let S = null;
function blank(){return {settings:{target:20,pour:1.5,tape:"in",theme:"dark",method:"scale"},products:[],counts:[]};}
function load(){
  try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(e){ S = null; }
  if(!S || !Array.isArray(S.products)) S = blank();
  S.settings = Object.assign(blank().settings, S.settings||{});
  S.counts = S.counts||[];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:NaN; };
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const money = n => (n<0?"-$":"$")+Math.abs(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => (n<0?"-$":"$")+Math.abs(Math.round(n||0)).toLocaleString("en-US");
const f1 = n => (Math.round((n||0)*10)/10).toFixed(1);
const uid = () => Math.random().toString(36).slice(2,9);
const fmtDate = ts => new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
const fmtDay = ts => new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const sizeLabel = ml => { const s = SIZES.find(x=>x[0]===ml); return s?s[1]:ml+" ml"; };
const val = (v,d) => (v===undefined||v===null||v===""||isNaN(v))?(d===undefined?"":d):v;

function density(p){ return p.density>0 ? p.density : (CATS[p.cat]||.97); }
function calc(p){
  const bOz = (p.ml||0)/OZ;
  const costOz = bOz>0 ? (p.cost||0)/bOz : 0;
  const pour = p.pour>0 ? p.pour : S.settings.pour;
  const costPour = costOz*pour;
  const pc = p.price>0 ? costPour/p.price*100 : null;
  const suggested = costPour/(S.settings.target/100);
  return {bOz,costOz,pour,costPour,pc,suggested,profit:p.price>0?p.price-costPour:null,pours:pour>0?bOz/pour:0};
}
function pcClass(pc){ if(pc==null) return "none"; const t=S.settings.target; return pc<=t?"ok":pc<=t+5?"warn":"bad"; }
function sortedProducts(){ return S.products.slice().sort((a,b)=>(a.cat||"").localeCompare(b.cat||"")||a.name.localeCompare(b.name)); }
function prod(id){ return S.products.find(p=>p.id===id); }
function curCount(){ return S.counts[S.counts.length-1]||null; }
function prevCount(){ return S.counts.length>1 ? S.counts[S.counts.length-2] : null; }
function totalOz(p,e){ return e ? (e.sealed||0)*calc(p).bOz + (e.open||0) : null; }

/* scale: oz left from gross weight */
function scaleOz(p,g){ if(!(p.tare>0)||!(g>0)) return null; return clamp((g-p.tare)/density(p)/OZ,0,calc(p).bOz); }
/* tape: oz left from liquid height (cm). Body = cylinder up to shoulder, then a frustum tapering to the neck. */
function tapeOz(p,h){
  if(!(p.fullH>0)||!(h>=0)) return null;
  const b = p.baseH||0, H = p.fullH-b; if(H<=0) return null;
  const Sh = clamp((p.shoulderH>0?p.shoulderH:p.fullH)-b,0,H), L=H-Sh, k=TAPER_K, a=1-k;
  const x = clamp(h-b,0,H);
  const vt = L>0 ? (L/3)*(1+k+k*k) : 0, total = Sh+vt;
  let v; if(x<=Sh) v=x; else { const t=x-Sh; v = Sh + (L/(3*a))*(1-Math.pow(1-a*t/L,3)); }
  return calc(p).bOz * v/total;
}
const tapeF = () => S.settings.tape==="in"?2.54:1;

/* ---------- bottle shapes & shelves ---------- */
const SHAPES = {

  squat:{label:"Squat",bw:50,sy:104,nw:15,ny:86,ty:66,k:"bell"},

const CAT_SHAPE = {"Vodka":"slim","Gin":"square","Rum":"classic","Tequila":"squat","Mezcal":"stubby","Whiskey":"square","Brandy":"decanter","Liqueur":"stubby","Cream Liqueur":"classic","Vermouth":"wine","Wine":"wine","Other":"classic"};
const LIQ = {"Vodka":"rgba(190,225,255,.55)","Gin":"rgba(200,240,225,.55)","Rum":"#b8742e","Tequila":"rgba(240,225,170,.75)","Mezcal":"rgba(235,215,160,.75)","Whiskey":"#c27a2c","Brandy":"#9c5524","Liqueur":"#8a3fb8","Cream Liqueur":"#e3cfaa","Vermouth":"rgba(225,210,140,.8)","Wine":"#7d1530","Other":"#c9a46b"};

const BRANDS = [

  ["ketel one","Vodka","slim",0,0,0],["belvedere","Vodka","slim",0,0,0],["ciroc","Vodka","slim",0,"#7fa7c9","#9aa3ad"],["stoli","Vodka","classic",0,0,"#b3202a"],
  ["deep eddy","Vodka","square",0,0,0],["new amsterdam","Vodka","slim",0,0,0],["svedka","Vodka","slim",0,0,0],["skyy","Vodka","slim",0,"#2b5fb3",0],
  ["tanqueray","Gin","squat",0,"#1f6b3a","#b3202a"],["hendrick","Gin","decanter",0,"#2a1d14",0],["bombay","Gin","square",0,"#3f7fd0","#9aa3ad"],
  ["beefeater","Gin","classic",0,0,"#b3202a"],["aviation","Gin","slim",0,0,0],["gordon","Gin","square",0,"#3f8f5a","#b3202a"],["roku","Gin","square",0,0,0],["empress","Gin","square","#5b4bb7",0,0],
  ["bacardi","Rum","classic",0,0,0],["captain morgan","Rum","classic","#b8742e",0,"#1c1c1e"],["malibu","Rum","classic",0,"#f2f2f2",0],["kraken","Rum","decanter","#3a2414","#1e140c",0],
  ["sailor jerry","Rum","square","#b8742e",0,0],["myers","Rum","flask","#5a2e14",0,0],["goslings","Rum","classic","#4a2512",0,0],["plantation","Rum","classic","#b8742e",0,0],
  ["patron","Tequila","squat",0,0,"#c9a46b"],["espolon","Tequila","slim",0,0,"#1c1c1e"],["jose cuervo","Tequila","classic",0,0,"#1c1c1e"],["cuervo","Tequila","classic",0,0,"#1c1c1e"],
  ["don julio","Tequila","square",0,0,"#c9a46b"],["casamigos","Tequila","square",0,0,"#1c1c1e"],["1800","Tequila","square",0,0,"#1c1c1e"],["herradura","Tequila","classic",0,0,"#c9a46b"],
  ["teremana","Tequila","squat",0,0,"#c9a46b"],["hornitos","Tequila","classic",0,0,0],["olmeca","Tequila","classic",0,0,0],["lunazul","Tequila","classic",0,0,0],["clase azul","Tequila","decanter",0,"#e9eef7","#c9a46b"],
  ["del maguey","Mezcal","stubby",0,0,"#c9a46b"],["400 conejos","Mezcal","classic",0,0,0],["montelobos","Mezcal","stubby",0,0,0],
  ["jameson","Whiskey","classic",0,"#3f6b44","#1c1c1e"],["jack daniel","Whiskey","square",0,0,"#1c1c1e"],["maker","Whiskey","square",0,0,"#b0151e"],["buffalo trace","Whiskey","classic",0,0,"#1c1c1e"],
  ["crown royal","Whiskey","decanter",0,0,"#c9a46b"],["jim beam","Whiskey","square",0,0,"#1c1c1e"],["bulleit","Whiskey","flask",0,0,"#c9a46b"],["woodford","Whiskey","flask",0,0,"#c9a46b"],
  ["fireball","Whiskey","classic","#c0461f",0,"#b0151e"],["johnnie walker","Whiskey","square",0,0,"#c9a46b"],["wild turkey","Whiskey","classic",0,0,"#1c1c1e"],["knob creek","Whiskey","square",0,0,"#1c1c1e"],
  ["evan williams","Whiskey","square",0,0,"#1c1c1e"],["four roses","Whiskey","classic",0,0,"#1c1c1e"],["basil hayden","Whiskey","slim",0,0,"#c9a46b"],["glenlivet","Whiskey","classic",0,"#2e5b3a",0],
  ["macallan","Whiskey","decanter",0,0,"#c9a46b"],["glenfiddich","Whiskey","square",0,"#2e5b3a",0],["dewar","Whiskey","classic",0,0,0],["seagram","Whiskey","decanter",0,0,0],["skrewball","Whiskey","classic","#a35a1f",0,0],
  ["hennessy","Brandy","decanter",0,0,"#1c1c1e"],["remy","Brandy","decanter",0,0,"#c9a46b"],["courvoisier","Brandy","decanter",0,0,"#c9a46b"],["e&j","Brandy","classic",0,0,"#c9a46b"],
  ["kahlua","Liqueur","stubby","#3b2314",0,"#c9a46b"],["aperol","Liqueur","stubby","#f26a1b",0,"#1c1c1e"],["campari","Liqueur","stubby","#c8102e",0,"#1c1c1e"],["jagermeister","Liqueur","square","#3a2414","#1f3b26","#c9a46b"],
  ["grand marnier","Liqueur","decanter","#c27a2c",0,"#b0151e"],["cointreau","Liqueur","square",0,"#c46a1a","#b0151e"],["st germain","Liqueur","slim","#e9d9a0",0,"#c9a46b"],["st-germain","Liqueur","slim","#e9d9a0",0,"#c9a46b"],
  ["disaronno","Liqueur","square","#a35a1f",0,"#c9a46b"],["frangelico","Liqueur","squat","#b8742e",0,"#c9a46b"],["chambord","Liqueur","decanter","#4a1030",0,"#c9a46b"],["midori","Liqueur","classic","#4caf3d",0,0],
  ["blue curacao","Liqueur","classic","#1e8fe0",0,0],["triple sec","Liqueur","classic",0,0,0],["amaretto","Liqueur","square","#a35a1f",0,0],["rumchata","Cream Liqueur","classic","#efe3cc",0,0],
  ["baileys","Cream Liqueur","classic","#e3cfaa","#3a2414","#1c1c1e"],["kahlua cream","Cream Liqueur","stubby","#d9c2a0",0,0],["fernet","Liqueur","classic","#2a1a10","#1e140c",0],["chartreuse","Liqueur","classic","#8bbf3a",0,0],
  ["dolin","Vermouth","wine",0,0,0],["martini","Vermouth","wine",0,0,"#b0151e"],["carpano","Vermouth","wine","#5a1e14",0,0],["noilly","Vermouth","wine",0,"#3f6b44",0],["cinzano","Vermouth","wine",0,0,0]
];
const norm = t => String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"");
function brandOf(name){ const n = norm(name); if(!n) return null; let best=null; BRANDS.forEach(b=>{ if(n.includes(b[0]) && (!best || b[0].length>best[0].length)) best=b; }); return best; }
function lookOf(p){
  const b = brandOf(p.name);
  const shape = SHAPES[p.shape] ? p.shape : (b ? b[2] : (CAT_SHAPE[p.cat]||"classic"));
  return {shape, liq: (b&&b[3]) || LIQ[p.cat] || LIQ.Other, glass: b&&b[4] || null, cap: b&&b[5] || null, brand: b, auto: !SHAPES[p.shape]};
}
const shapeOf = p => lookOf(p).shape;
/* photo storage (IndexedDB, falls back to memory) */
const PHOTOS = {};
let idb = null;
function idbOpen(){ return new Promise(res=>{ try{ const r = indexedDB.open("pourcount",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos"); r.onsuccess=()=>{ idb=r.result; res(idb); }; r.onerror=()=>res(null); }catch(e){ res(null); } }); }
function idbTx(mode, fn){ return new Promise(res=>{ if(!idb) return res(null); try{ const tx=idb.transaction("photos",mode), st=tx.objectStore("photos"), out=fn(st); tx.oncomplete=()=>res(out&&out.result); tx.onerror=()=>res(null); }catch(e){ res(null); } }); }
const photoPut = (id,data) => { PHOTOS[id]=data; return idbTx("readwrite",st=>st.put(data,id)); };
const photoDel = id => { delete PHOTOS[id]; return idbTx("readwrite",st=>st.delete(id)); };
const photoClear = () => { Object.keys(PHOTOS).forEach(k=>delete PHOTOS[k]); return idbTx("readwrite",st=>st.clear()); };
async function photosLoad(){
  await idbOpen(); if(!idb) return;
  await new Promise(res=>{ try{ const tx=idb.transaction("photos"), st=tx.objectStore("photos"), cur=st.openCursor(); cur.onsuccess=()=>{ const c=cur.result; if(c){ PHOTOS[c.key]=c.value; c.continue(); } else res(); }; cur.onerror=()=>res(); }catch(e){ res(); } });
}
function bottlePath(sh){
  const B=158, L=30-sh.bw/2, Rr=30+sh.bw/2, nl=30-sh.nw/2, nr=30+sh.nw/2, sy=sh.sy, ny=sh.ny, d=sy-ny, mx=x=>60-x;
  const c = {round:[[L,sy-d*.6],[nl,ny+d*.45]], square:[[L,ny+1],[L+3,ny]], slope:[[L,sy-d*.3],[nl,ny+d*.6]], bell:[[L,ny],[nl-4,ny]], dome:[[L,ny-6],[nl-10,ny]]}[sh.k];
  return `M${L+5} ${B}Q${L} ${B} ${L} ${B-5}L${L} ${sy}C${c[0][0]} ${c[0][1]} ${c[1][0]} ${c[1][1]} ${nl} ${ny}L${nl} ${sh.ty}L${nr} ${sh.ty}L${nr} ${ny}C${mx(c[1][0])} ${c[1][1]} ${mx(c[0][0])} ${c[0][1]} ${Rr} ${sy}L${Rr} ${B-5}Q${Rr} ${B} ${Rr-5} ${B}Z`;
}
function bottleArt(p, frac, h, opts){
  opts = opts||{};
  const lk = lookOf(p), sh = SHAPES[lk.shape], scale = opts.noScale?1:(p.ml>=1700?1.18:p.ml>=1000?1.08:p.ml<=400?.8:1);
  const H = (h||118)*scale, W = H*60/160, id = "b"+uid(), dP = bottlePath(sh);
  const top = sh.ny-2, y = frac==null ? 999 : 158-(158-top)*clamp(frac,0,1);
  const capR = `<rect x="${30-sh.nw/2-1.5}" y="${sh.ty-11}" width="${sh.nw+3}" height="12" rx="2"`;
  const photo = opts.photo!==undefined ? opts.photo : (p.id && PHOTOS[p.id]);
  if(photo){
    return `<svg width="${W.toFixed(1)}" height="${H.toFixed(1)}" viewBox="0 0 60 160" aria-hidden="true"><defs><clipPath id="${id}"><path d="${dP}"/>${capR}/></clipPath></defs>
      <image href="${photo}" x="0" y="0" width="60" height="160" preserveAspectRatio="none" clip-path="url(#${id})"/>
      ${frac==null?"":`<rect clip-path="url(#${id})" x="0" y="${sh.ty-12}" width="60" height="${Math.max(0,y-sh.ty+12)}" fill="#000" opacity=".5"/>
      <rect clip-path="url(#${id})" x="0" y="${y-1}" width="60" height="2" fill="var(--tint)"/>`}
      <path d="${dP}" fill="none" stroke="var(--glassLine)" stroke-width="1"/></svg>`;
  }
  return `<svg width="${W.toFixed(1)}" height="${H.toFixed(1)}" viewBox="0 0 60 160" aria-hidden="true"><defs><clipPath id="${id}"><path d="${dP}"/></clipPath></defs>
    <path d="${dP}" fill="var(--glass)"/>
    <rect clip-path="url(#${id})" x="0" y="${y}" width="60" height="160" fill="${lk.liq}"/>
    ${lk.glass?`<path d="${dP}" fill="${lk.glass}" opacity=".42"/>`:""}
    <rect clip-path="url(#${id})" x="${30-sh.bw/2+4}" y="${sh.sy}" width="4" height="${150-sh.sy}" rx="2" fill="#fff" opacity=".18"/>
    <path d="${dP}" fill="none" stroke="var(--glassLine)" stroke-width="1.6"/>
    ${capR} fill="${lk.cap||"var(--cap)"}"/></svg>`;
}
const thumb = (p, frac) => `<span class="thumb">${bottleArt(p, frac, 44, {noScale:true})}</span>`;
function ensureShelves(){
  if(!Array.isArray(S.shelves) || !S.shelves.length) S.shelves = [{id:"s"+uid(),name:"Back Bar"}];
  const ids = S.shelves.map(x=>x.id);
  S.products.forEach((p,i)=>{ if(!ids.includes(p.shelf)) p.shelf = ids[0]; if(typeof p.pos!=="number") p.pos = 1000+i; });
}
function shelfItems(id){ return S.products.filter(p=>p.shelf===id).sort((a,b)=>a.pos-b.pos); }
function shelfOrder(){ ensureShelves(); return S.shelves.flatMap(sh=>shelfItems(sh.id)); }
function orderedProducts(){ return S.settings.view==="shelf" ? shelfOrder() : sortedProducts(); }
let arranging = false;
function viewSeg(){ return `<div class="seg" style="margin-top:2px">${[["list","List","grid"],["shelf","Shelves","bottle"]].map(([k,l,n])=>`<button class="${(S.settings.view||"list")===k?"on":""}" data-a="setView" data-v="${k}">${mi(n)}${l}</button>`).join("")}</div>`; }
function shelvesView(mode){
  ensureShelves();
  const c = curCount(), last = c;
  let html = `<div class="toolbar">${arranging
    ? `<button class="btn gray" data-a="addShelf">+ Add Shelf</button><button class="btn" data-a="arrange">Done</button>`
    : `<button class="btn gray" data-a="arrange">${mi("sliders")}Arrange Bottles</button>`}</div>`;
  if(!arranging) html += `<div class="sec-f" style="margin-top:8px">Liquid shows the open bottle · <b style="color:var(--label)">+2</b> means 2 sealed backups${mode==="count"?" · tap a bottle to count it":" · tap a bottle to edit it"}</div>`;
  if(arranging) html += `<div class="hintbar">Press and hold a bottle, then drag it to where it sits on your bar. Tap a bottle for more options.</div>`;
  html += `<div class="${arranging?"arranging":""}" id="shelves">`;
  S.shelves.forEach(sh=>{
    const items = shelfItems(sh.id);
    html += `<div class="shelf"><div class="shelf-h">${mi("bottle")}<b>${esc(sh.name)} · ${items.length}</b>${arranging?`<button data-a="renameShelf" data-v="${sh.id}">Rename</button>`:""}</div>
      <div class="shelf-row" data-shelf="${sh.id}">`;
    items.forEach(p=>{
      const cc = calc(p), e = c && c.items[p.id];
      let frac = null, meta = "", badge = "", sealed = "";
      if(mode==="count"){
        if(e){ frac = cc.bOz? e.open/cc.bOz : 0; meta = `${f1(totalOz(p,e))} oz`; badge = `<span class="badge">${I.tick}</span>`; if(e.sealed) sealed = `<span class="sealed">+${e.sealed}</span>`; }
        else { const pv = prevCount() && prevCount().items[p.id]; frac = pv&&cc.bOz ? pv.open/cc.bOz : null; meta = `<span style="color:var(--orange)">Not counted</span>`; }
      } else {
        const le = last && last.items[p.id]; frac = le&&cc.bOz ? le.open/cc.bOz : 1;
        const cls = pcClass(cc.pc); meta = `<span class="${cls}">${cc.pc==null?"no price":f1(cc.pc)+"%"}</span> · ${money(cc.costPour)}`;
        if(le && le.sealed) sealed = `<span class="sealed">+${le.sealed}</span>`;
      }
      const dim = mode==="count" && !e ? ' style="opacity:.55"' : "";
      html += `<div class="btl" data-id="${p.id}" data-mode="${mode}" role="button" tabindex="0" aria-label="${esc(p.name)}"><div class="g"><span${dim}>${bottleArt(p,frac)}</span>${badge}${sealed}</div><div class="edge"></div><div class="lbl">${esc(p.name)}</div><div class="bm num">${meta}</div></div>`;
    });
    if(!items.length) html += `<div class="btl empty-slot"><div class="g">${arranging?"Drag bottles here":"Empty shelf"}</div><div class="edge" style="width:136px"></div></div>`;
    html += `</div></div>`;
  });
  return html + `</div>`;
}
/* drag to arrange */
let drag = null, holdT = null, suppressClick = false;
function saveShelfDom(){
  document.querySelectorAll("#shelves .shelf-row").forEach(row=>{
    row.querySelectorAll(".btl[data-id]").forEach((el,i)=>{ const p=prod(el.dataset.id); if(p){ p.shelf=row.dataset.shelf; p.pos=i; } });
  });
  save();
}
document.addEventListener("pointerdown",e=>{
  const b = e.target.closest(".arranging .btl[data-id]"); if(!b) return;
  const x0=e.clientX, y0=e.clientY;
  holdT = setTimeout(()=>{
    const r = b.getBoundingClientRect(), fl = b.cloneNode(true);
    fl.classList.add("drag-float"); fl.style.left=x0+"px"; fl.style.top=y0+"px"; fl.style.width=r.width+"px";
    document.body.appendChild(fl); b.classList.add("ghost");
    drag = {el:b, fl, x:x0, y:y0}; try{ navigator.vibrate && navigator.vibrate(12); }catch(_){}
    tick();
  }, 220);
  const cancelHold = ev=>{ if(!drag && Math.hypot(ev.clientX-x0,ev.clientY-y0)>8){ clearTimeout(holdT); } };
  document.addEventListener("pointermove",cancelHold,{once:false});
  const up = ()=>{ clearTimeout(holdT); document.removeEventListener("pointermove",cancelHold); document.removeEventListener("pointerup",up); document.removeEventListener("pointercancel",up); };
  document.addEventListener("pointerup",up); document.addEventListener("pointercancel",up);
});
document.addEventListener("touchmove",e=>{ if(drag) e.preventDefault(); },{passive:false});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  drag.x=e.clientX; drag.y=e.clientY; drag.fl.style.left=e.clientX+"px"; drag.fl.style.top=e.clientY+"px";
  const under = document.elementFromPoint(e.clientX,e.clientY), row = under && under.closest(".shelf-row");
  if(!row) return;
  const kids = [...row.querySelectorAll(".btl[data-id]")].filter(k=>k!==drag.el);
  const before = kids.find(k=>{ const r=k.getBoundingClientRect(); return e.clientX < r.left+r.width/2; });
  const emp = row.querySelector(".empty-slot"); if(emp) emp.remove();
  if(before){ if(drag.el.nextSibling!==before) row.insertBefore(drag.el,before); } else if(row.lastElementChild!==drag.el) row.appendChild(drag.el);
});
function tick(){
  if(!drag) return;
  document.querySelectorAll("#shelves .shelf-row").forEach(row=>{
    const r=row.getBoundingClientRect(); if(drag.y<r.top||drag.y>r.bottom) return;
    if(drag.x<r.left+44) row.scrollLeft-=8; else if(drag.x>r.right-44) row.scrollLeft+=8;
  });
  requestAnimationFrame(tick);
}
function endDrag(){ if(!drag) return; drag.fl.remove(); drag.el.classList.remove("ghost"); drag=null; suppressClick=true; setTimeout(()=>suppressClick=false,60); saveShelfDom(); render(); }
document.addEventListener("pointerup",endDrag); document.addEventListener("pointercancel",endDrag);
function moveBottle(id, dir){
  const p = prod(id), items = shelfItems(p.shelf), i = items.indexOf(p), j = i+dir;
  if(j<0||j>=items.length) return; items.splice(i,1); items.splice(j,0,p); items.forEach((x,k)=>x.pos=k); save(); render();
}
function bottleMenu(id){
  const p = prod(id);
  const acts = [{label:"Move Left",fn:()=>moveBottle(id,-1)},{label:"Move Right",fn:()=>moveBottle(id,1)}]
    .concat(S.shelves.filter(sh=>sh.id!==p.shelf).map(sh=>({label:"Move to "+sh.name,fn:()=>{ p.shelf=sh.id; p.pos=1e6; shelfItems(sh.id).forEach((x,k)=>x.pos=k); save(); render(); }})))
    .concat([{label:"Edit Bottle",fn:()=>productSheet(p)}]);
  actionSheet(p.name, acts);
}

/* ---------- photo framing ---------- */
let fr = null; // {img, s, x, y, W, H, done}
function openFramer(src, done){
  const shp = SHAPES[edit ? shapeOf(edit) : "classic"], stage = $("#frameStage");
  $("#framer").classList.add("show");
  const H = Math.min(stage.clientHeight-10, 470), W = H*60/160, box = $("#frameBox");
  box.style.width=W+"px"; box.style.height=H+"px";
  const dP = bottlePath(shp);
  box.querySelector("svg") && box.querySelector("svg").remove();
  box.insertAdjacentHTML("beforeend",`<svg viewBox="0 0 60 160" preserveAspectRatio="none"><path fill-rule="evenodd" fill="rgba(0,0,0,.55)" d="M0 0H60V160H0Z ${dP} M${30-shp.nw/2-1.5} ${shp.ty-11}h${shp.nw+3}v12h-${shp.nw+3}z"/><path d="${dP}" fill="none" stroke="#ff9f0a" stroke-width=".8" stroke-dasharray="2 1.5"/></svg>`);
  const img = $("#frameImg");
  img.onload = ()=>{
    const s = Math.max(W/img.naturalWidth, H/img.naturalHeight);
    fr = {img, s, s0:s, x:(W-img.naturalWidth*s)/2, y:(H-img.naturalHeight*s)/2, W, H, done};
    $("#frameZoom").value = 1; drawFrame();
  };
  img.onerror = ()=>{ toast("Couldn't open that photo"); closeFramer(); };
  img.src = src;
}
function drawFrame(){ if(!fr) return; fr.img.style.transform = `translate(${fr.x}px,${fr.y}px) scale(${fr.s})`; }
function closeFramer(){ $("#framer").classList.remove("show"); fr=null; }
(function(){
  let p0=null;
  const st = ()=>$("#frameStage");
  document.addEventListener("pointerdown",e=>{ if(!fr || !e.target.closest("#frameStage")) return; p0={x:e.clientX,y:e.clientY,fx:fr.x,fy:fr.y}; e.preventDefault(); });
  document.addEventListener("pointermove",e=>{ if(!fr||!p0) return; fr.x=p0.fx+e.clientX-p0.x; fr.y=p0.fy+e.clientY-p0.y; drawFrame(); });
  document.addEventListener("pointerup",()=>{ p0=null; });
  document.addEventListener("input",e=>{ if(e.target.id!=="frameZoom"||!fr) return; const ns=fr.s0*(+e.target.value), cx=fr.W/2, cy=fr.H/2; fr.x = cx-(cx-fr.x)*ns/fr.s; fr.y = cy-(cy-fr.y)*ns/fr.s; fr.s=ns; drawFrame(); });
})();
function frameExport(){
  const c = document.createElement("canvas"); c.width=240; c.height=640; const k = 240/fr.W, g = c.getContext("2d");
  g.fillStyle="#111"; g.fillRect(0,0,240,640);
  g.drawImage(fr.img, fr.x*k, fr.y*k, fr.img.naturalWidth*fr.s*k, fr.img.naturalHeight*fr.s*k);
  return c.toDataURL("image/jpeg",.8);
}
function pickPhoto(input){
  input.value=""; input.onchange = ()=>{ const f=input.files&&input.files[0]; if(!f) return; const url=URL.createObjectURL(f);
    openFramer(url, data=>{ URL.revokeObjectURL(url); if(edit){ edit._photo=data; dirty=true; refreshLook(); } }); };
  input.click();
}

/* ---------- barcode scanning ---------- */
const normCode = c => { const d=String(c||"").replace(/\D/g,""); return d.length===12 ? "0"+d : d; };  // UPC-A and EAN-13 read the same
let scan = null;
async function getDetector(){
  const formats = ["ean_13","ean_8","upc_a","upc_e","code_128"];
  try{ if("BarcodeDetector" in window){ const sup = await BarcodeDetector.getSupportedFormats(); if(sup && sup.some(f=>formats.includes(f))) return new BarcodeDetector({formats: formats.filter(f=>sup.includes(f))}); } }catch(e){}
  if(!window.BarcodeDetectionAPI){
    await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="vendor/barcode-detector.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    window.BarcodeDetectionAPI.prepareZXingModule({overrides:{locateFile:(path,prefix)=> path.endsWith(".wasm") ? new URL("vendor/"+path, location.href).href : prefix+path}});
  }
  return new window.BarcodeDetectionAPI.BarcodeDetector({formats});
}
async function startScan(onCode){
  $("#scanner").classList.add("show"); $("#scanManual").value=""; $("#scanMsg").textContent="Starting camera…";
  scan = {onCode, stream:null, stop:false};
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!scan || scan.stop){ stream.getTracks().forEach(t=>t.stop()); return; }
    scan.stream = stream; const v=$("#scanVideo"); v.srcObject=stream; await v.play();
    $("#scanMsg").textContent="Line up the barcode inside the box";
    const det = await getDetector(); const sc = scan;
    const loop = async ()=>{
      if(!scan || sc.stop || scan!==sc) return;
      try{ const r = await det.detect(v); const code = r && r[0] && r[0].rawValue; if(code){ try{ navigator.vibrate&&navigator.vibrate(30); }catch(_){} stopScan(); onCode(code); return; } }catch(e){}
      setTimeout(loop, 180);
    };
    loop();
  }catch(e){
    $("#scanMsg").textContent = "Camera isn't available. Allow camera access, or type the barcode number below.";
  }
}
function stopScan(){ if(!scan) return; scan.stop=true; if(scan.stream) scan.stream.getTracks().forEach(t=>t.stop()); const v=$("#scanVideo"); v.srcObject=null; scan=null; $("#scanner").classList.remove("show"); }
function guessCat(text){
  const t = norm(text);
  const map = [["cream","Cream Liqueur"],["vodka","Vodka"],["gin","Gin"],["rum","Rum"],["ron ","Rum"],["mezcal","Mezcal"],["tequila","Tequila"],["bourbon","Whiskey"],["whisk","Whiskey"],["scotch","Whiskey"],["rye","Whiskey"],["cognac","Brandy"],["brandy","Brandy"],["vermouth","Vermouth"],["liqueur","Liqueur"],["liquor","Liqueur"],["amaro","Liqueur"],["wine","Wine"]];
  const hit = map.find(([k])=>t.includes(k)); return hit ? hit[1] : null;
}
function parseMl(q){
  const m = String(q||"").replace(",",".").match(/(\d+(?:\.\d+)?)\s*(ml|cl|l|lt|liters?|litres?|fl\.?\s*oz)\b/i); if(!m) return null;
  const n=parseFloat(m[1]), u=m[2].toLowerCase();
  const ml = u==="ml"?n : u==="cl"?n*10 : u.startsWith("fl")?n*OZ : n*1000;
  return Math.round(ml);
}
async function lookupBarcode(code){
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), 7000);
  try{
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,brands,quantity,image_front_url,image_url,categories_tags`, {signal:ctl.signal});
    if(!r.ok) return null; const j = await r.json(); if(!j || j.status!==1 || !j.product) return null;
    const pr = j.product, brand = (pr.brands||"").split(",")[0].trim(), pname = (pr.product_name_en||pr.product_name||"").trim();
    let name = pname && brand && !norm(pname).includes(norm(brand)) ? brand+" "+pname : (pname||brand);
    return {name: name||null, ml: parseMl(pr.quantity), cat: guessCat((pr.categories_tags||[]).join(" ")+" "+name), img: pr.image_front_url||pr.image_url||null};
  }catch(e){ return null; } finally{ clearTimeout(t); }
}
async function imgToDataUrl(url){
  try{ const r = await fetch(url,{mode:"cors"}); if(!r.ok) return null; const b = await r.blob(); return await new Promise(res=>{ const fr2=new FileReader(); fr2.onload=()=>res(fr2.result); fr2.onerror=()=>res(null); fr2.readAsDataURL(b); }); }catch(e){ return null; }
}
async function applyBarcodeToEdit(code){
  if(!edit) return; code = normCode(code);
  const bc = $('#sheetIn [data-f="barcode"]'); if(bc) bc.value = code; dirty = true;
  const dupe = S.products.find(x=>normCode(x.barcode)===code && x.id!==edit.id);
  if(dupe){ toast(dupe.name+" already has this barcode"); }
  toast("Looking up "+code+"…");
  const info = await lookupBarcode(code);
  if(!edit) return;
  if(!info){ toast("Not in the product database. Fill in the details and add a photo."); updatePreview(); return; }
  const set = (f,v)=>{ const el=$(`#sheetIn [data-f="${f}"]`); if(el && v!=null && v!=="") el.value=v; };
  if(info.name && !$('#sheetIn [data-f="name"]').value) set("name", info.name);
  if(info.ml){ set("ml", info.ml); document.querySelectorAll("#sheetIn .chip").forEach(c=>c.classList.toggle("on", +c.dataset.v===info.ml)); }
  const b = brandOf(info.name); const cat = (b&&b[1]) || info.cat; if(cat && !edit._catSet) set("cat", cat);
  updatePreview(); if($("#shapes")) $("#shapes").innerHTML = shapeChips();
  toast("Found: "+(info.name||code));
  if(info.img && !PHOTOS[edit.id] && !edit._photo){
    const data = await imgToDataUrl(info.img);
    if(data && edit){ openFramer(data, d=>{ if(edit){ edit._photo=d; dirty=true; refreshLook(); } }); }
  }
}
function scanToCount(code){
  code = normCode(code); const p = S.products.find(x=>normCode(x.barcode)===code);
  if(p){ countSheet(p.id); return; }
  actionSheet("No bottle has barcode "+code, [
    {label:"Add as New Bottle", fn:()=>{ productSheet(null); applyBarcodeToEdit(code); }},
    {label:"Attach to an Existing Bottle", fn:()=>attachSheet(code)}
  ]);
}
function attachSheet(code){
  openSheet(`<div class="sh-head"><button class="l" data-a="closeSheet">Cancel</button><div class="t">Attach Barcode</div><button class="r" style="visibility:hidden">x</button></div>
  <div class="sh-body"><div class="sec-f" style="margin:12px 32px">Pick the bottle that has barcode ${esc(code)}. Next time you scan it, its count opens right away.</div>

}

function readDraft(){

function vCount(){
  const c = curCount();
  if(!S.products.length) return `<h1 class="large">Count</h1><div class="empty">${I.scale}<h3>Add bottles first</h3>Your count list is built from your products.</div><button class="btn" data-a="tab" data-v="products">Go to Products</button>`;
  if(!c) return `<h1 class="large">Count</h1><div class="empty">${I.scale}<h3>Start your first count</h3>Weigh, measure or eyeball each open bottle and tally the sealed ones. Two counts give you usage and variance.</div><button class="btn" data-a="newCount">Start Count</button>`;
  const list = orderedProducts();
  const done = list.filter(p=>c.items[p.id]).length;
  let value = 0; list.forEach(p=>{ const t=totalOz(p,c.items[p.id]); if(t!=null) value += t*calc(p).costOz; });
  let html = `<h1 class="large">Count</h1>
   <div class="hero"><div class="k">${fmtDate(c.date)}${prevCount()?" · since "+fmtDay(prevCount().date):""}</div>
   <div class="v num">${done} <span style="font-size:20px;color:var(--sec);font-weight:600">of ${list.length} counted</span></div>
   <div class="m num">On-hand value ${money(value)}</div>
   <div class="bar"><i style="width:${list.length?done/list.length*100:0}%"></i></div></div>`;
  const next = list.find(p=>!c.items[p.id]);
  html += next ? `<div class="spacer"></div><button class="btn" data-a="countItem" data-v="${next.id}">Count next: ${esc(next.name)}</button>` : `<div class="spacer"></div><button class="btn" data-a="tab" data-v="reports">All counted · View Reports</button>`;
  html += `<button class="scanbtn" data-a="scanCount">${mi("menu")}Scan a Bottle to Count It</button>`;
  html += `<div class="spacer"></div>${viewSeg()}`;
  if(S.settings.view==="shelf"){
    html += shelvesView("count") + `<div class="spacer" style="height:28px"></div><div class="group"><button class="row center" style="width:100%" data-a="newCount">Start New Count</button></div>
    <div class="sec-f">Starting a new count keeps this one as the starting point for usage and variance.</div>`;
    return html;
  }
  let cat=null;
  list.forEach(p=>{
    if(p.cat!==cat){ if(cat!==null) html+="</div>"; cat=p.cat; html+=`${catH(cat)}<div class="group">`; }
    const e = c.items[p.id], cc = calc(p);
    const meta = e ? `${f1(e.open)} oz open · ${e.sealed||0} sealed` : `Not counted · ${sizeLabel(p.ml)}`;
    html += `<div class="row tap" data-a="countItem" data-v="${p.id}">
      <span class="check ${e?"done":"todo"}">${e?I.tick:""}</span>
      ${thumb(p, e&&cc.bOz ? e.open/cc.bOz : null)}
      <div class="main"><div class="name">${esc(p.name)}</div><div class="meta num">${meta}</div></div>
      <div class="val num">${e?`<b>${f1(totalOz(p,e))} oz</b><small>${money(totalOz(p,e)*cc.costOz)}</small>`:""}</div>${I.chev}</div>`;
  });
  html += `</div><div class="spacer" style="height:28px"></div><div class="group"><button class="row center" style="width:100%" data-a="newCount">Start New Count</button></div>
  <div class="sec-f">Starting a new count keeps this one as the starting point for usage and variance.</div>`;
  return html;
}

  const r = $("#raw"); if(r && !("ontouchstart" in window)) r.focus();

}
function readCount(){
  const p = prod(ct.id);
  const sEl = $("#sealed"); ct.sealed = Math.max(0, Math.round(num(sEl?sEl.value:0))||0);
  const rEl = $("#recv"); if(rEl) ct.recv = Math.max(0, Math.round(num(rEl.value))||0);
  let open = null, tmp = Object.assign({},p);
  if(ct.method==="scale"){
    const ta=$("#calTare"), fu=$("#calFull");
    if(ta||fu){ let t=num(ta.value); if(!(t>0)&&num(fu.value)>0) t = num(fu.value)-p.ml*density(p); tmp.tare = t>0?t:null; }
    ct.raw = $("#raw").value; open = scaleOz(tmp, num(ct.raw));
  } else if(ct.method==="tape"){
    const fh=$("#calFullH"), sh=$("#calShH");
    if(fh){ tmp.fullH = num(fh.value)>0?num(fh.value)*tapeF():null; tmp.shoulderH = num(sh.value)>0?num(sh.value)*tapeF():null; }
    const v = num($("#raw").value); ct.raw = v>=0? v*tapeF() : ""; open = ct.raw===""?null:tapeOz(tmp, ct.raw);
  } else {
    ct.tenths = +$("#tenths").value; ct.raw = ct.tenths; open = calc(p).bOz*ct.tenths/10;
  }
  return {open, tmp};
}
function updateGauge(){
  const p = prod(ct.id), {open} = readCount(), c = calc(p);
  const frac = open!=null && c.bOz ? open/c.bOz : 0;
  const tot = (open||0)+ct.sealed*c.bOz;
  $("#gauge").innerHTML = `${bottleSvg(frac)}<div><div class="big num">${open==null?"—":f1(open)}<span> oz open</span></div>
    <div class="m num">${open==null?"Enter a reading":Math.round(frac*100)+"% · "+(c.pour?Math.floor(open/c.pour):0)+" pours · "+money(open*c.costOz)}</div>
    <div class="m num">Total on hand ${f1(tot)} oz · ${money(tot*c.costOz)}</div></div>`;
}
function saveCount(next){
  const p = prod(ct.id), {open, tmp} = readCount();
  if(open==null){ toast(ct.method==="scale"?(tmp.tare>0?"Enter the weight":"Add an empty or sealed weight"):ct.method==="tape"?(tmp.fullH>0?"Enter the level":"Add the full fill line"):"Set a level"); return; }
  if(ct.method==="scale" && tmp.tare>0 && !(p.tare>0)) p.tare = Math.round(tmp.tare);
  if(ct.method==="tape" && tmp.fullH>0 && !(p.fullH>0)){ p.fullH = tmp.fullH; p.shoulderH = tmp.shoulderH; }
  const c = curCount();
  c.items[ct.id] = {sealed:ct.sealed, open:+open.toFixed(2), method:ct.method, raw:ct.raw};
  if(prevCount()){ c.purchases = c.purchases||{}; if(ct.recv>0) c.purchases[ct.id]=ct.recv; else delete c.purchases[ct.id]; }
  S.settings.method = ct.method; save();
  if(next){
    const list = orderedProducts(), i = list.findIndex(x=>x.id===ct.id);
    const n = list.slice(i+1).find(x=>!c.items[x.id]) || list.find(x=>!c.items[x.id]);
    render();
    if(n){ countSheet(n.id); toast("Saved"); return; }
    closeSheet(); toast("Count complete"); return;
  }
  closeSheet(); render(); toast("Saved");
}

/* ---------- Reports ---------- */
function usageRows(){
  const c = curCount(), pv = prevCount(); if(!c||!pv) return null;
  const rows = [];
  sortedProducts().forEach(p=>{
    const a = totalOz(p,pv.items[p.id]), b = totalOz(p,c.items[p.id]);
    const cc = calc(p), purch = (c.purchases||{})[p.id]||0, sold = (c.sales||{})[p.id];
    if(a==null && !purch) return;
    const used = b==null ? null : (a||0) + purch*cc.bOz - b;
    const exp = sold!=null ? sold*cc.pour : null;
    const v = used!=null && exp!=null ? used-exp : null;
    rows.push({p,cc,start:a||0,end:b,purch,sold,used,exp,v,usedCost:used!=null?used*cc.costOz:null,vCost:v!=null?v*cc.costOz:null,rev:sold!=null&&p.price>0?sold*p.price:null});
  });
  return rows;
}

    return html;
  }
  // usage
  const rows = usageRows();
  if(!rows) return html+`<div class="empty"><h3>Needs two counts</h3>Usage is the difference between two counts plus what you received. Finish this count, then start a new one next shift or week.</div>${c?`<button class="btn" data-a="tab" data-v="count">Go to Count</button>`:""}`;
  let used=0, vcost=0, rev=0, revCost=0, any=false;
  rows.forEach(r=>{ if(r.usedCost!=null) used+=r.usedCost; if(r.vCost!=null){ vcost+=r.vCost; any=true; } if(r.rev!=null&&r.usedCost!=null){ rev+=r.rev; revCost+=r.usedCost; } });
  const actual = rev>0 ? revCost/rev*100 : null;

    <div class="sec-f">${fmtDay(prevCount().date)} → ${fmtDay(c.date)}. Tap a bottle to enter pours sold from your POS and see what is unaccounted for.</div>`;
  html += `<div class="sec-h">By Bottle</div><div class="group">`;
  rows.sort((a,b)=>(b.vCost??-1e9)-(a.vCost??-1e9)||(b.usedCost||0)-(a.usedCost||0)).forEach(r=>{
    const vp = r.v!=null&&r.exp>0 ? r.v/r.exp*100 : null;

    const meta = r.used==null ? "Not counted this time" : `Used ${f1(r.used)} oz${r.purch?` · +${r.purch} recv`:""}${r.sold!=null?` · ${r.sold} sold`:""}`;
    html += `<div class="row tap" data-a="usageItem" data-v="${r.p.id}"><div class="main"><div class="name">${esc(r.p.name)}</div><div class="meta num">${meta}</div></div>
      <div class="val num">${r.v!=null?`<b class="${cls}">${f1(Math.abs(r.v))} oz ${r.v>0?"over":"under"}</b><small class="${cls}">${money(Math.abs(r.vCost))}${vp!=null?" · "+Math.round(Math.abs(vp))+"%":""}</small>`:r.usedCost!=null?`<b>${money(r.usedCost)}</b><small>used</small>`:""}</div>${I.chev}</div>`;
  });
  return html+`</div><div class="sec-f">Over means more left the bottle than was rung up: heavy pours, comps, spills or loss.</div>`;

  const P = [
    ["Tito's Handmade Vodka","Vodka",750,19.99,8,520],["Grey Goose","Vodka",750,32.99,11,640],
    ["Hendrick's Gin","Gin",750,34.99,11,615],["Tanqueray","Gin",750,24.99,9,560],

    ["Dolin Dry Vermouth","Vermouth",750,13.99,6,480]
  ];
  const st = blank(); st.settings.theme = S.settings.theme; st.settings.tape = S.settings.tape;
  st.products = P.map(([name,cat,ml,cost,price,tare])=>({id:uid(),name,cat,ml,cost,pour:cat==="Vermouth"?1:1.5,price,tare,density:null,fullH:cat==="Vermouth"?null:28,shoulderH:20,baseH:.6}));
  const now = Date.now(), t0 = now-7*864e5;
  const a = {id:uid(),date:t0,items:{},purchases:{},sales:{}}, b = {id:uid(),date:now-36e5,items:{},purchases:{},sales:{}};
  const vars=[.02,.15,.04,-.01,.06,.03,.11,.02,.05,.09,.01,.03,.0,.07,.02];
  st.products.forEach((p,i)=>{
    const bo = p.ml/OZ, d = CATS[p.cat];
    const open0 = bo*(.3+((i*37)%60)/100);
    a.items[p.id] = {sealed:2,open:+open0.toFixed(2),method:"scale",raw:Math.round(p.tare+open0*OZ*d)};
    const sold = 8+((i*13)%22), recv = i%3===0?1:0;
    const used = sold*p.pour*(1+vars[i]);
    let tot = 2*bo+open0+recv*bo-used; tot = Math.max(tot,0);
    const sealed = Math.max(0,Math.floor(tot/bo)-(tot%bo<.5?1:0)), open = tot-sealed*bo;
    if(i!==14) b.items[p.id] = {sealed,open:+open.toFixed(2),method:"scale",raw:Math.round(p.tare+open*OZ*d)};

  st.products.forEach((p,i)=>{ p.shelf = place[p.name]||(p.cat==="Vermouth"?"sw":"sb"); p.pos=i; });
  return st;
}

}
function closeAS(){ $("#asScrim").classList.remove("show"); $("#as").classList.remove("show"); asFn=null; }
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1500); }
$("#scrim").addEventListener("click",requestClose);
(function(){ const sh=$("#sheet"); let y0=null, dy=0;
  sh.addEventListener("touchstart",e=>{ if(e.target.closest("button,input")||!e.target.closest(".grab,.sh-head")) return; y0=e.touches[0].clientY; dy=0; sh.style.transition="none"; },{passive:true});
  sh.addEventListener("touchmove",e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); sh.style.transform="translateY("+dy+"px)"; },{passive:true});
  const end=()=>{ if(y0==null) return; y0=null; sh.style.transition=""; sh.style.transform=""; if(dy>110) requestClose(); };
  sh.addEventListener("touchend",end); sh.addEventListener("touchcancel",end);
})();
$("#asScrim").addEventListener("click",closeAS);

/* ---------- theme ---------- */
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: light)") : null;
function applyTheme(){
  const t = S.settings.theme==="system" ? (mq&&mq.matches?"light":"dark") : S.settings.theme;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t==="light"?"#f2f2f7":"#000000";
}
mq && mq.addEventListener && mq.addEventListener("change",applyTheme);

/* ---------- events ---------- */
const A = {
  tab:(v)=>setTab(v),
  addProduct:()=>productSheet(null),
  photoTake:()=>pickPhoto($("#fileTake")),
  photoPick:()=>pickPhoto($("#filePick")),
  photoRemove:()=>{ edit._photo=null; dirty=true; refreshLook(); },
  toggleShapes:()=>{ const w=$("#shapeWrap"); w.hidden=!w.hidden; },
  frameCancel:()=>closeFramer(),
  frameUse:()=>{ if(!fr) return; const d=frameExport(), cb=fr.done; closeFramer(); cb&&cb(d); },
  scanForEdit:()=>startScan(code=>applyBarcodeToEdit(code)),
  scanCount:()=>startScan(code=>scanToCount(code)),
  scanClose:()=>stopScan(),
  scanManualGo:()=>{ const v=($("#scanManual").value||"").replace(/\D/g,""); if(v.length<6){ toast("Enter the full barcode number"); return; } const cb=scan&&scan.onCode; stopScan(); cb&&cb(v); },
  attachTo:(v)=>{ const [id,code]=v.split("|"); const p=prod(id); S.products.forEach(x=>{ if(normCode(x.barcode)===code) x.barcode=null; }); p.barcode=code; save(); closeSheet(); render(); toast("Barcode attached to "+p.name); setTimeout(()=>countSheet(id),350); },
  setView:(v)=>{ S.settings.view=v; if(v!=="shelf") arranging=false; save(); render(); },
  arrange:()=>{ arranging=!arranging; render(); },
  addShelf:()=>shelfSheet(null),
  renameShelf:(v)=>shelfSheet(v),
  saveShelf:(v)=>{ const n=($("#shName").value||"").trim(); if(!n){ toast("Name the shelf"); return; }
    if(v){ S.shelves.find(x=>x.id===v).name=n; } else S.shelves.push({id:"s"+uid(),name:n});
    save(); closeSheet(); render(); },
  deleteShelf:(v)=>confirmSheet("Delete this shelf? Its bottles move to another shelf.","Delete Shelf",()=>{ const to=S.shelves.find(x=>x.id!==v).id; S.products.forEach(p=>{ if(p.shelf===v){ p.shelf=to; p.pos=1e6+p.pos; } }); S.shelves=S.shelves.filter(x=>x.id!==v); shelfItems(to).forEach((x,k)=>x.pos=k); save(); closeSheet(); render(); }),
  pickShape:(v)=>{ edit.shape=v||null; $("#shapes").innerHTML=shapeChips(); dirty=true; refreshLook(); },
  asPick:(v)=>{ const a=(window.__acts||[])[+v]; closeAS(); a&&a.fn(); },
  editProduct:(v)=>productSheet(prod(v)),
  saveProduct, closeSheet:requestClose,
  toggleAdv:()=>{ const a=$("#adv"); a.hidden=!a.hidden; if(!a.hidden) a.previousElementSibling.scrollIntoView({behavior:"smooth",block:"start"}); },
  help:()=>helpSheet(),
  plans:()=>plansSheet(),
  sizeChip:(v,el)=>{ $('#sheetIn [data-f="ml"]').value=v; document.querySelectorAll("#sheetIn .chip").forEach(c=>c.classList.toggle("on",c===el)); dirty=true; updatePreview(); },
  deleteProduct:()=>{ const id=edit.id; confirmSheet("Delete this bottle and its counts?","Delete Bottle",()=>{ photoDel(id); S.products=S.products.filter(p=>p.id!==id); S.counts.forEach(c=>{ delete c.items[id]; c.purchases&&delete c.purchases[id]; c.sales&&delete c.sales[id]; }); save(); closeSheet(); render(); }); },
  newCount:()=>{ const go=()=>{ S.counts.push({id:uid(),date:Date.now(),items:{},purchases:{},sales:{}}); save(); setTab("count"); toast("New count started"); };
    const c=curCount(); if(c && !Object.keys(c.items).length){ c.date=Date.now(); save(); setTab("count"); return; }
    c ? confirmSheet("Start a new count? The current one becomes the starting point for usage.","Start New Count",go) : go(); },
  countItem:(v)=>countSheet(v),
  method:(v)=>{ readCount(); ct.method=v; ct.raw=""; drawCountSheet(); dirty=true; },
  sealed:(v)=>{ const el=$("#sealed"); el.value=Math.max(0,(Math.round(num(el.value))||0)+(+v)); dirty=true; updateGauge(); },
  saveCount:(v)=>saveCount(v==="1"),
  clearCount:()=>{ delete curCount().items[ct.id]; save(); closeSheet(); render(); },
  rseg:(v)=>{ rseg=v; render(); },
  usageItem:(v)=>usageSheet(v),
  step:(v)=>{ const [id,d]=v.split(":"); const el=$("#"+id); el.value=Math.max(0,(Math.round(num(el.value))||0)+(+d)); dirty=true; },
  saveUsage:(v)=>{ const c=curCount(), pu=Math.round(num($("#uP").value))||0, so=num($("#uS").value);
    if(pu>0) c.purchases[v]=pu; else delete c.purchases[v];
    if(so>=0) c.sales[v]=Math.round(so); else delete c.sales[v];
    save(); closeSheet(); render(); },
  theme:(v)=>{ S.settings.theme=v; save(); applyTheme(); render(); },
  tapeUnit:(v)=>{ S.settings.tape=v; save(); render(); },
  exportCSV:()=>textSheet("CSV Export",csv(),false),
  backup:()=>textSheet("Backup",JSON.stringify(S),false),
  restore:()=>textSheet("Restore","",true),
  doRestore:()=>{ try{ const d=JSON.parse($("#txt").value); if(!Array.isArray(d.products)) throw 0; confirmSheet("Replace all current data with this backup?","Restore",()=>{ S=d; load2(); save(); closeSheet(); applyTheme(); render(); toast("Restored"); }); }catch(e){ toast("That isn't a valid backup"); } },
  copyText:()=>{ const t=$("#txt"); const done=()=>toast("Copied"); try{ navigator.clipboard.writeText(t.value).then(done,()=>{ t.select(); toast("Select all and copy"); }); }catch(e){ t.select(); toast("Select all and copy"); } },
  loadSample:()=>{ const go=()=>{ photoClear(); S=sample(); save(); setTab("products"); toast("Sample bar loaded"); }; S.products.length?confirmSheet("Replace your data with the sample bar?","Load Sample",go):go(); },
  delCount:(v)=>confirmSheet("Delete this count?","Delete Count",()=>{ S.counts=S.counts.filter(c=>c.id!==v); save(); render(); }),
  erase:()=>confirmSheet("Erase all bottles, counts and settings on this device?","Erase All Data",()=>{ const th=S.settings.theme; photoClear(); S=blank(); S.settings.theme=th; save(); setTab("products"); }),
  asOk:()=>{ const f=asFn; closeAS(); f&&f(); }, asCancel:closeAS
};
function load2(){ S.settings = Object.assign(blank().settings,S.settings||{}); S.counts=S.counts||[]; ensureShelves(); }
document.addEventListener("click",e=>{
  const b = e.target.closest(".btl[data-id]");
  if(b){ if(suppressClick) return; const id=b.dataset.id; if(arranging) bottleMenu(id); else if(b.dataset.mode==="count") countSheet(id); else productSheet(prod(id)); return; }
  const t=e.target.closest("[data-a]"); if(!t) return; const f=A[t.dataset.a]; if(f){ e.preventDefault(); f(t.dataset.v,t); } });
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ query=t.value; $("#plist").innerHTML=productList(); return; }
  if(t.closest("#sheetIn") && edit && t.dataset.f==="name" && edit._new && !edit._catSet){ const b=brandOf(t.value), sel=$('#sheetIn [data-f="cat"]'); if(b && sel && sel.value!==b[1]){ sel.value=b[1]; } }
  if(t.closest("#sheetIn")){ dirty=true; if(edit) updatePreview(); else if(ct && $("#gauge")) updateGauge(); }
  if(t.dataset.s){ const v=num(t.value); if(v>0){ S.settings[t.dataset.s]=t.dataset.s==="target"?clamp(v,1,100):v; save(); } }
});
document.addEventListener("change",e=>{ if(e.target.closest("#sheetIn") && edit){ updatePreview(); if(e.target.dataset.f==="cat"){ edit._catSet=true; if($("#shapes")) $("#shapes").innerHTML = shapeChips(); } } });
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="raw"){ e.preventDefault(); saveCount(true); } if(e.key==="Escape" && $("#framer").classList.contains("show")){ closeFramer(); return; } if(e.key==="Escape" && $("#scanner").classList.contains("show")){ stopScan(); return; } if(e.key==="Escape"){ if($("#as").classList.contains("show")) closeAS(); else requestClose(); } if(e.key==="Enter" && e.target.matches && e.target.matches("div[data-a]")) e.target.click(); });
document.addEventListener("focusin",e=>{ const t=e.target; if(t.tagName==="INPUT" && t.getAttribute("inputmode") && t.value) setTimeout(()=>{ try{ t.select(); }catch(_){} },0); });

/* ---------- boot ---------- */
load(); ensureShelves(); applyTheme();
photosLoad().then(()=>{ if(Object.keys(PHOTOS).length) render(); });
setTab(location.hash.slice(1)||"products", false);
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
</body>
</html>
