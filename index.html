<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Tallypour</title>
<meta name="apple-mobile-web-app-title" content="Tallypour">
<meta name="description" content="Tallypour: bar inventory by scale, tape or eye.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  color-scheme:dark;
  --bg:#000;--cell:#1c1c1e;--cell2:#2c2c2e;--sep:rgba(84,84,88,.6);
  --label:#fff;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);
  --tint:#4d86ff;--tintText:#000;--green:#30d158;--red:#ff453a;--orange:#4d86ff;--blue:#0a84ff;
  --fill:rgba(118,118,128,.24);--bar:rgba(18,18,20,.82);--shadow:rgba(0,0,0,.5);
  --glass:rgba(255,255,255,.07);--glassLine:rgba(235,235,245,.38);--cap:#48484a;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#f2f2f7;--cell:#fff;--cell2:#e5e5ea;--sep:rgba(60,60,67,.22);
  --label:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);
  --tint:#c46a00;--tintText:#fff;--green:#248a3d;--red:#d70015;--orange:#c46a00;--blue:#007aff;
  --fill:rgba(118,118,128,.12);--bar:rgba(249,249,249,.86);--shadow:rgba(0,0,0,.18);
  --glass:rgba(255,255,255,.7);--glassLine:rgba(60,60,67,.45);--cap:#3a3a3c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label)}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* nav bar */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:var(--st);height:calc(44px + var(--st));display:flex;align-items:center;justify-content:center;background:transparent;transition:background .2s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav .t{font-weight:600;font-size:17px;opacity:0;transition:opacity .15s}
.nav.solid .t{opacity:1}
.nav .r{position:absolute;right:8px;bottom:0;height:44px;display:flex;align-items:center}
.navbtn{color:var(--tint);font-size:17px;padding:0 8px;height:44px;display:flex;align-items:center;gap:4px}
.navbtn svg{width:24px;height:24px}

main{padding:calc(44px + var(--st)) env(safe-area-inset-right,0px) calc(96px + var(--sb)) env(safe-area-inset-left,0px);max-width:640px;margin:0 auto}
h1.large{font-size:34px;font-weight:700;letter-spacing:.3px;margin:2px 16px 8px}
.sub{color:var(--sec);font-size:15px;margin:-4px 16px 12px}

/* grouped lists */
.sec-h{color:var(--sec);font-size:13px;text-transform:uppercase;margin:22px 32px 7px;letter-spacing:-.05px}
.sec-f{color:var(--sec);font-size:13px;margin:7px 32px 0;line-height:1.35}
.group{background:var(--cell);border-radius:10px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;min-height:44px;padding:0 16px;position:relative;gap:10px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.tap:active{background:var(--cell2)}
.row .main{flex:1;min-width:0;padding:10px 0}
.row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--sec);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .val{color:var(--sec);text-align:right;white-space:nowrap}
.row .val b{color:var(--label);font-weight:500;display:block}
.row .val small{font-size:13px}
.chev{width:8px;height:13px;flex:none;opacity:.35}
.row label{flex:none;min-width:120px}
.row input,.row select{flex:1;min-width:0;border:0;background:none;text-align:right;outline:none;padding:11px 0;color:var(--label);font-size:17px}
.row input::placeholder{color:var(--ter)}
.row .pre{margin-left:auto;margin-right:-8px;color:var(--sec);flex:none}
.row input.money{flex:none;width:5ch;text-align:left}
.row input:focus{color:var(--label)}
.row select{-webkit-appearance:none;appearance:none;direction:rtl}
.row .unit{color:var(--ter);font-size:15px;flex:none}
.row.center{justify-content:center;color:var(--tint)}
.row.danger{justify-content:center;color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ic{width:29px;height:29px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.hi{padding-left:14px;gap:12px}
.row+.row.hi::before{left:55px}
.row.hi label{min-width:96px}
.mi{display:inline-flex;vertical-align:-2px;margin-right:5px}
.mi svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg button{display:flex;align-items:center;justify-content:center;gap:5px}
.seg button .mi{margin:0}
.shelf{margin:0 0 6px}
.shelf-h{display:flex;align-items:center;gap:8px;margin:18px 16px 4px 32px;color:var(--sec);font-size:13px;text-transform:uppercase}
.shelf-h b{font-weight:400;flex:1}
.shelf-h button{color:var(--tint);text-transform:none;font-size:15px;height:36px;padding:0 6px}
.shelf-row{display:flex;align-items:stretch;overflow-x:auto;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:200px}
.shelf-row::-webkit-scrollbar{display:none}
.btl{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.btl .g{height:142px;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.btl .g svg{display:block;overflow:visible}
.btl .edge{height:10px;width:100%;background:linear-gradient(#6b4a2d,#432d1a);box-shadow:0 3px 6px rgba(0,0,0,.45)}
html[data-theme=light] .btl .edge{background:linear-gradient(#caa47c,#9c734c);box-shadow:0 3px 6px rgba(0,0,0,.18)}
.btl .lbl{width:74px;text-align:center;margin-top:7px;font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px}
.btl .bm{font-size:11px;color:var(--sec);margin-top:2px;white-space:nowrap}
.btl .badge{position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.btl .badge svg{width:12px;height:12px}
.btl .sealed{position:absolute;top:6px;left:6px;font-size:11px;font-weight:600;background:var(--fill);color:var(--label);border-radius:8px;padding:1px 6px}
.btl:active .g svg{transform:scale(.96)}
.btl.empty-slot{width:150px;color:var(--ter);font-size:13px;cursor:default}
.btl.empty-slot .g{align-items:center;border:1.5px dashed var(--ter);border-bottom:0;border-radius:10px 10px 0 0;width:136px}
.arranging .btl:not(.empty-slot) .g{animation:jig .32s ease-in-out infinite alternate}
.arranging .btl:nth-child(2n) .g{animation-delay:-.16s}
@keyframes jig{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.btl.ghost{opacity:.25}
.drag-float{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-70%) scale(1.12);filter:drop-shadow(0 10px 16px rgba(0,0,0,.45));transition:none}
.toolbar{display:flex;gap:8px;margin:10px 16px 0}
.toolbar .btn{margin:0;height:40px;font-size:15px;flex:1;width:auto}
.hintbar{margin:10px 16px 0;padding:10px 14px;border-radius:10px;background:var(--fill);color:var(--sec);font-size:14px;line-height:1.35}
.shapes{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.shapes::-webkit-scrollbar{display:none}
.shape{flex:none;width:62px;height:84px;border-radius:10px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;font-size:11px;color:var(--sec);gap:3px}
.shape.on{background:var(--tint);color:var(--tintText)}
.thumb{width:30px;height:46px;flex:none;display:flex;align-items:flex-end;justify-content:center}
.look{display:flex;gap:14px;align-items:center;padding:12px 16px}
.look .art{width:64px;height:120px;display:flex;align-items:flex-end;justify-content:center;flex:none}
.look .txt{flex:1;min-width:0}
.look .txt b{display:block;font-weight:600}
.look .txt span{display:block;color:var(--sec);font-size:14px;margin-top:2px}
.lbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lbtn{height:34px;padding:0 12px;border-radius:17px;background:var(--fill);color:var(--tint);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.lbtn.red{color:var(--red)}
.lbtn[hidden]{display:none}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:var(--fill);color:var(--tint);font-weight:600;margin:10px 16px 0;width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:none;flex-direction:column}
.overlay.show{display:flex}
.ov-head{display:flex;align-items:center;justify-content:space-between;height:52px;padding:var(--st) 8px 0;flex:none}
.ov-head button{color:#4d86ff;padding:0 10px;height:44px;font-size:17px}
.ov-head .t{font-weight:600}
.scan-stage{flex:1;position:relative;overflow:hidden}
.scan-stage video{width:100%;height:100%;object-fit:cover}
.scan-box{position:absolute;left:12%;right:12%;top:38%;height:22%;border:3px solid #4d86ff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scan-line{position:absolute;left:14%;right:14%;top:49%;height:2px;background:#ff453a;box-shadow:0 0 8px #ff453a}
.scan-msg{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:15px;padding:0 24px;text-shadow:0 1px 3px #000}
.ov-foot{padding:12px 16px calc(14px + var(--sb));display:flex;gap:8px;flex:none;background:#000}
.ov-foot input{flex:1;height:44px;border-radius:10px;border:0;background:#2c2c2e;color:#fff;padding:0 12px;font-size:17px;outline:none}
.ov-foot button{height:44px;padding:0 16px;border-radius:10px;background:#4d86ff;color:#fff;font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--sec);vertical-align:1px}
.pill.pro{background:var(--tint);color:var(--tintText)}
.auth{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:none}
.auth.show{display:block}
.auth .in{max-width:400px;margin:0 auto;padding:calc(var(--st) + 44px) 24px 40px}
.auth .logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:28px;font-weight:700;letter-spacing:-.4px;margin-bottom:6px}
.auth .logo svg{width:40px;height:40px}
.auth .tag{text-align:center;color:var(--sec);font-size:15px;margin:0 0 26px}
.af{display:block;margin-bottom:12px}
.af span{display:block;font-size:13px;color:var(--sec);margin:0 4px 5px}
.af input{width:100%;height:48px;border-radius:12px;border:0;background:var(--cell);padding:0 14px;font-size:17px;outline:none;color:var(--label)}
.af input:focus{box-shadow:0 0 0 2px var(--tint)}
.auth .btn{margin:8px 0 0;width:100%}
.an{color:var(--sec);font-size:13px;text-align:center;margin:12px 0 0;line-height:1.4}
.as2{text-align:center;color:var(--sec);font-size:15px;margin:16px 0 0}
.as2 button{color:var(--tint)}
.aerr{color:var(--red);font-size:14px;text-align:center;min-height:20px;margin:10px 0 0}
.btbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 16px 0;font-size:14px;color:var(--sec)}
.btbar b{font-size:17px;color:var(--label)}
.btdot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none}
.btdot.ok{background:var(--green)}
.codebox{font:600 26px/1 ui-monospace,Menlo,monospace;letter-spacing:3px;text-align:center;padding:18px 0 6px}
#exCount{direction:ltr;text-align:right;text-overflow:ellipsis}
.legend{display:flex;gap:14px;color:var(--sec);font-size:13px;margin:-6px 16px 12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ok{color:var(--green)!important}.warn{color:var(--orange)!important}.bad{color:var(--red)!important}
.bg-ok{background:var(--green)}.bg-warn{background:var(--orange)}.bg-bad{background:var(--red)}.bg-none{background:var(--ter)}

/* search */
.search{margin:0 16px 4px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px}
.search svg{width:16px;height:16px;opacity:.5;flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--sec)}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 16px;position:relative}
.seg button{flex:1;height:36px;border-radius:7px;font-size:13px;font-weight:500;color:var(--label);transition:background .15s}
.seg button.on{background:var(--cell2);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
html[data-theme=light] .seg button.on{background:#fff}

/* chips */
.chips{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:14px}
.chip.on{background:var(--tint);color:var(--tintText)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--sep);border-radius:10px;overflow:hidden;margin:0 16px}
.stats>div{background:var(--cell);padding:10px 14px}
.stats .k{font-size:12px;color:var(--sec);text-transform:uppercase;letter-spacing:.2px}
.stats .v{font-size:22px;font-weight:600;margin-top:2px}
.hero{margin:0 16px;background:var(--cell);border-radius:10px;padding:14px 16px}
.hero .k{font-size:13px;color:var(--sec)}
.hero .v{font-size:34px;font-weight:700;letter-spacing:.2px}
.hero .m{font-size:14px;color:var(--sec);margin-top:2px}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--tint);border-radius:2px}

.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:12px;background:var(--tint);color:var(--tintText);font-weight:600;margin:0 16px;width:calc(100% - 32px);font-size:17px}
.btn.gray{background:var(--fill);color:var(--tint)}
.btn:active{opacity:.75}
.empty{text-align:center;color:var(--sec);padding:40px 32px}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:10px}
.empty h3{color:var(--label);margin:0 0 6px;font-size:20px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 0 calc(var(--sb) + 4px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--sec);min-height:44px}
html[data-theme=light] .tabbar button{color:rgba(60,60,67,.6)}
.tabbar svg{width:26px;height:26px}
.tabbar button.on{color:var(--tint)!important}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;height:calc(100% - var(--st) - 12px);background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:0 -6px 30px var(--shadow)}
html[data-theme=dark] .sheet{background:#1c1c1e}
html[data-theme=dark] .sheet .group,html[data-theme=dark] .sheet .stats>div,html[data-theme=dark] .sheet .hero{background:#2c2c2e}
html[data-theme=dark] .sheet .row.tap:active{background:#3a3a3c}
html[data-theme=dark] .sheet .seg button.on{background:#636366}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:6px auto 0;flex:none}
.sh-head button.dis{opacity:.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sh-head{display:flex;align-items:center;height:48px;padding:0 8px;flex:none}
.sh-head .t{flex:1;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.sh-head button{color:var(--tint);padding:0 8px;height:44px;min-width:70px}
.sh-head button.l{text-align:left}.sh-head button.r{text-align:right;font-weight:600}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(30px + var(--sb))}

/* count sheet */
.gauge{display:flex;align-items:center;gap:16px;margin:4px 16px 16px;background:var(--cell);border-radius:12px;padding:12px 16px}
html[data-theme=dark] .sheet .gauge{background:#2c2c2e}
.gauge svg{width:46px;height:108px;flex:none}
.gauge .big{font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1}
.gauge .big span{font-size:20px;font-weight:600;color:var(--sec)}
.gauge .m{color:var(--sec);font-size:15px;margin-top:6px}
.bigin{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 16px 4px;background:var(--cell);border-radius:12px;padding:6px 16px}
html[data-theme=dark] .sheet .bigin{background:#2c2c2e}
.bigin input{width:100%;text-align:center;border:0;background:none;outline:none;font-size:44px;font-weight:600;padding:6px 0;font-variant-numeric:tabular-nums}
.bigin input::placeholder{color:var(--ter)}
.bigin span{color:var(--sec);font-size:20px}
.hint{color:var(--sec);font-size:13px;text-align:center;margin:4px 24px 0}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;overflow:hidden;flex:none}
.stepper button{width:48px;height:42px;font-size:22px;color:var(--label);line-height:1}
.stepper input{width:44px;text-align:center;border:0;background:none;outline:none;font-size:17px;font-weight:600;padding:0;color:var(--label)}
input[type=range]{width:100%;accent-color:var(--tint);height:32px}
.ticks{display:flex;justify-content:space-between;color:var(--sec);font-size:12px;padding:0 4px}
.check{width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.check.done{background:var(--green)}
.check.todo{border:1.5px solid var(--ter)}
.check svg{width:13px;height:13px}
.catlabel{font-size:12px;color:var(--sec);background:var(--fill);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* action sheet + toast */
.as{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--sb));z-index:61;max-width:480px;margin:0 auto;transform:translateY(130%);transition:transform .28s cubic-bezier(.2,.9,.25,1)}
.as.show{transform:none}
.as .box{background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
html[data-theme=dark] .as .box{background:rgba(44,44,46,.95)}
.as .msg{text-align:center;color:var(--sec);font-size:13px;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.as button{display:block;width:100%;height:56px;font-size:20px;color:var(--blue)}
.as .box button+button{border-top:.5px solid var(--sep)}
.as button.d{color:var(--red)}
.as .cancel{background:var(--cell);border-radius:14px;font-weight:600}
html[data-theme=dark] .as .cancel{background:#2c2c2e}
.asscrim{z-index:60}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 76px);transform:translate(-50%,20px);opacity:0;z-index:120;background:var(--cell2);color:var(--label);padding:10px 18px;border-radius:20px;font-size:15px;font-weight:500;transition:all .25s;pointer-events:none;box-shadow:0 6px 20px var(--shadow);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
textarea.code{width:calc(100% - 32px);margin:0 16px;height:220px;border-radius:10px;border:0;background:var(--cell);padding:12px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--label);resize:none;outline:none}
html[data-theme=dark] .sheet textarea.code{background:#2c2c2e}
.spacer{height:16px}

:root{
  color-scheme:dark;
  --bg:#0c1915;--cell:#14271f;--cell2:#1d3a2f;--sep:rgba(214,226,214,.13);
  --label:#f1ecdc;--sec:rgba(241,236,220,.66);--ter:rgba(241,236,220,.36);
  --tint:#4d86ff;--tintText:#1a1607;--green:#7ad6a0;--red:#f2796d;--orange:#eaa646;--blue:#4d86ff;
  --fill:rgba(214,226,214,.10);--bar:rgba(12,25,21,.88);--shadow:rgba(0,0,0,.5);
  --glass:rgba(255,255,255,.06);--glassLine:rgba(241,236,220,.42);--cap:#40584c;--tile:rgba(220,182,99,.14);
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#eef1e8;--cell:#fbfcf7;--cell2:#e1e7d9;--sep:rgba(20,45,35,.14);
  --label:#11261d;--sec:rgba(17,38,29,.68);--ter:rgba(17,38,29,.38);
  --tint:#1d5b45;--tintText:#f6f3e6;--green:#1b7a4b;--red:#c23a2e;--orange:#9a5f06;--blue:#1d5b45;
  --fill:rgba(20,45,35,.07);--bar:rgba(238,241,232,.9);--shadow:rgba(17,38,29,.2);
  --glass:rgba(255,255,255,.8);--glassLine:rgba(17,38,29,.45);--cap:#2c3d35;--tile:rgba(29,91,69,.10);
}
body{font-family:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:0;font-size:16.5px}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
input:focus-visible,select:focus-visible{outline:none}
h1.large{font-size:33px;font-weight:700;letter-spacing:-.025em;margin:6px 20px 10px}
.sub{margin:-4px 20px 12px}
.sec-h{text-transform:none;font-size:14px;font-weight:600;letter-spacing:0;margin:26px 22px 8px;color:var(--sec)}
.sec-f{margin:8px 22px 0}
.shelf-h{text-transform:none;font-size:14px;font-weight:600;margin-left:22px}
.shelf-h b{font-weight:600}
.stats .k{text-transform:none;font-size:13px;letter-spacing:0}
.stats .v,.hero .v,.gauge .big,.bigin input,.codebox{font-weight:700;letter-spacing:-.02em}
.group,.stats,.hero,.gauge,.bigin{border-radius:16px}
.hero{box-shadow:inset 0 0 0 1px var(--sep)}
.row{min-height:50px}
.row .meta{font-size:13.5px}
.ic{width:32px;height:32px;border-radius:10px;background:var(--tile);color:var(--icc,var(--tint))}
.ic svg{width:18px;height:18px;stroke-width:1.9}
.row+.row.hi::before{left:58px}
.btn{height:52px;border-radius:14px;font-weight:650;font-size:17px;letter-spacing:-.005em}
.btn.gray{background:var(--tile);color:var(--tint)}
.scanbtn{border-radius:14px;background:var(--tile)}
.lbtn{background:var(--tile)}
.seg{border-radius:12px;padding:3px}
.seg button{border-radius:9px;font-size:14px;font-weight:550;color:var(--sec)}
.seg button.on,html[data-theme=light] .seg button.on,html[data-theme=dark] .sheet .seg button.on{background:var(--tint);color:var(--tintText);box-shadow:none}
.chip{font-weight:500}
.search{border-radius:12px;height:40px}
.pill{border-radius:7px;font-weight:700}
.navbtn svg{width:26px;height:26px}
.nav .t,.sh-head .t{font-weight:650;letter-spacing:-.01em}
.sh-head button.r{font-weight:650}
.tabbar{padding-top:7px}
.tabbar button{font-size:11px;font-weight:550;gap:3px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{font-weight:700}
.railbrand,.railfoot{display:none}
.toast{background:var(--label);color:var(--bg);font-weight:600}
.as button{color:var(--tint);font-size:18px}
.as .box,html[data-theme=dark] .as .box{background:var(--cell2)}
.as .cancel,html[data-theme=dark] .as .cancel{background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep)}
.sheet{border-radius:22px 22px 0 0}
html[data-theme=dark] .sheet{background:var(--sheet)}
html[data-theme=dark] .sheet .group,html[data-theme=dark] .sheet .stats>div,html[data-theme=dark] .sheet .hero,html[data-theme=dark] .sheet .gauge,html[data-theme=dark] .sheet .bigin,html[data-theme=dark] .sheet textarea.code{background:var(--cell)}
html[data-theme=dark] .sheet .row.tap:active{background:var(--cell2)}
.af input{border-radius:14px;height:52px;box-shadow:inset 0 0 0 1px var(--sep)}
.auth .logo{font-size:30px;letter-spacing:-.03em}
.btl .edge{background:linear-gradient(#7a5a34,#4a341d)}
.empty svg{color:var(--tint);opacity:.7}
.check.done{background:var(--green)}
.check.done svg{stroke:var(--bg)}
html[data-theme=light] .check.done svg{stroke:#fff}
.hintbar{border-radius:14px}
.dot{width:9px;height:9px}

/* ===== Desktop: side rail, wide content, detail panel on the right ===== */
@media (min-width:960px){
  body{padding-left:256px;font-size:16px}
  .tabbar{top:0;bottom:0;left:0;right:auto;width:256px;flex-direction:column;justify-content:flex-start;gap:4px;padding:22px 14px 18px;background:var(--cell);box-shadow:1px 0 0 var(--sep);-webkit-backdrop-filter:none;backdrop-filter:none}
  .railbrand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:700;letter-spacing:-.03em;padding:4px 10px 22px}
  .railbrand svg{width:34px;height:34px}
  .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:13px;width:100%;min-height:0;height:46px;padding:0 13px;border-radius:12px;font-size:16px;font-weight:550;color:var(--sec)}
  .tabbar button:hover{background:var(--fill)}
  .tabbar button.on{background:var(--tile);font-weight:650}
  .railfoot{display:block;margin-top:auto;padding:14px 12px 4px;border-top:1px solid var(--sep);font-size:13px;color:var(--sec)}
  .railfoot b{display:block;color:var(--label);font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav{left:256px}
  main{max-width:900px;padding:calc(30px + var(--st)) 28px 60px}
  .nav{display:none}
  h1.large{font-size:42px;margin-bottom:14px;display:flex;align-items:center}
  .deskadd{display:inline-flex!important}
  .stats{grid-template-columns:repeat(4,1fr)}
  .row.tap:hover{background:var(--fill)}
  .row.tap,.btl,.chip,.lbtn,.shape{cursor:pointer}
  .shelf-row{scrollbar-width:thin;padding-bottom:6px}
  .shelf-row::-webkit-scrollbar{display:block;height:8px}
  .shelf-row::-webkit-scrollbar-thumb{background:var(--fill);border-radius:4px}
  .btl{width:92px}
  .sheet{left:auto;right:0;margin:0;width:500px;max-width:500px;height:100%;border-radius:0;transform:translateX(105%);box-shadow:-12px 0 40px var(--shadow)}
  .sheet.show{transform:none}
  .grab{display:none}
  .sh-head{height:60px;padding-top:6px}
  .as{left:256px;right:0;top:28%;bottom:auto;opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .16s,transform .16s}
  .as.show{opacity:1;pointer-events:auto;transform:none}
  .toast{left:calc(50% + 128px);bottom:34px}

:root{
  --bg:#000;--cell:#121316;--cell2:#1e2025;--sep:#2a2c33;--sheet:#0a0b0d;
  --label:#fff;--sec:#aab0ba;--ter:#6a707b;--fill:#1e2025;--tile:#1e2025;--bar:#000;--shadow:rgba(0,0,0,.6);
  --green:#3ddc84;--red:#ff5d62;--orange:#ffb224;--glass:rgba(255,255,255,.07);--glassLine:rgba(255,255,255,.55);--cap:#50545e;
  --tint:#4d86ff;--tintText:#fff;--blue:var(--tint);
}
html[data-theme=light]{
  --bg:#fff;--cell:#f3f4f6;--cell2:#e4e6eb;--sep:#dcdfe5;--sheet:#fff;
  --label:#0a0b0d;--sec:#535965;--ter:#9aa0ab;--fill:#eceef1;--tile:#e7e9ee;--bar:#fff;--shadow:rgba(10,11,13,.18);
  --green:#0b8f4d;--red:#d42a37;--orange:#a86200;--glass:rgba(255,255,255,.85);--glassLine:rgba(10,11,13,.5);--cap:#2e3138;
  --tint:#1f5eff;--tintText:#fff;--blue:var(--tint);
}
body{font-family:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
h1.large{font-size:36px;font-weight:800;letter-spacing:-.035em}
.group,.stats,.hero,.gauge,.bigin,.hintbar{border-radius:18px;box-shadow:inset 0 0 0 1px var(--sep)}
.stats{background:var(--sep)}
.hero .v,.stats .v,.gauge .big,.bigin input{font-weight:800;letter-spacing:-.03em}
.hero.prim{background:var(--tint);color:var(--tintText);box-shadow:none;padding:18px 18px 16px}
.hero.prim .k,.hero.prim .m{color:inherit;opacity:.8}
.hero.prim .v{font-size:44px;line-height:1.05}
.hero.prim .v span{color:inherit!important;opacity:.8}
.hero.prim .bar{background:rgba(0,0,0,.18);height:8px;border-radius:4px;margin-top:14px}
.hero.prim .bar i{background:var(--tintText);border-radius:4px}
.ic{background:var(--tile);color:var(--tint);border-radius:11px;width:34px;height:34px}
.row+.row.hi::before{left:60px}
.row+.row::before{background:var(--sep)}
.btn{border-radius:16px;height:54px;font-weight:700}
.btn.gray,.scanbtn,.lbtn{background:var(--cell);color:var(--label);box-shadow:inset 0 0 0 1px var(--sep)}
.scanbtn .mi,.lbtn .mi,.btn.gray .mi{color:var(--tint)}
.seg{background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep);border-radius:14px;padding:4px}
.seg button{border-radius:10px;font-weight:600}
.seg button.on,html[data-theme=light] .seg button.on,html[data-theme=dark] .sheet .seg button.on{background:var(--label);color:var(--bg)}
.chip{background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep)}
.chip.on{box-shadow:none}
.search{background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep)}
.sec-h{font-weight:700;color:var(--label);font-size:15px;margin-top:28px}
.shelf-h{color:var(--label);font-weight:700}
.shelf-h b{font-weight:700}
.shelf-h .mi{color:var(--tint)}
.toast{background:var(--label);color:var(--bg)}
.as .box,html[data-theme=dark] .as .box{background:var(--cell2);-webkit-backdrop-filter:none;backdrop-filter:none}
.pill{background:var(--cell2);color:var(--label)}
.nav.solid{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.af input{background:var(--cell)}
html[data-theme=dark] .sheet{background:var(--sheet)}
.sheet{box-shadow:0 0 0 1px var(--sep),0 -10px 40px var(--shadow)}
.btl .sealed{background:var(--cell2);box-shadow:inset 0 0 0 1px var(--sep)}
.check.todo{border-color:var(--ter)}

<script src="exports.js"></script>
<script>
(function(){
"use strict";
const OZ = 29.5735;
let KEY = "tallypour.demo";
const CATS = {"Vodka":.95,"Gin":.95,"Rum":.95,"Tequila":.95,"Mezcal":.95,"Whiskey":.95,"Brandy":.95,"Liqueur":1.06,"Cream Liqueur":1.07,"Vermouth":1.02,"Wine":.99,"Other":.97};
const SIZES = [[375,"375 ml"],[750,"750 ml"],[1000,"1 L"],[1750,"1.75 L"]];
const TAPER_K = 0.35; // neck radius as a fraction of body radius for tape model

/* ---------- state ---------- */
let S = null;
function blank(){return {settings:{target:20,pour:1.5,tape:"in",theme:"dark",method:"scale",bar:"",mode:"liquor",beerTarget:25},products:[],beers:[],counts:[]};}
function load(){
  try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(e){ S = null; }
  if(!S || !Array.isArray(S.products)) S = blank();
  S.settings = Object.assign(blank().settings, S.settings||{});
  S.counts = S.counts||[];
  S.beers = S.beers||[];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} scheduleSync(); }

/* ---------- account, plan & sync ---------- */
const BOOT_HASH = location.hash.slice(1); let firstEnter = true;
function landTab(){ if(firstEnter && !BOOT_HASH){ tab = S.products.length ? "count" : "products"; try{ history.replaceState(null,"","#"+tab); }catch(e){} } firstEnter = false; }
let MODE = "boot";            // "demo" (this device only) or "cloud" (signed in)
let ME = null, VENUE = null, CFG = null;
let shadow = {}, rev = 0, hardPull = false;
let syncT = null, syncing = false, syncErr = null, pollT = null;
const LS = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function api(method, url, body){
  const r = await fetch(url, {method, headers: body ? {"content-type":"application/json","x-tp":"1"} : {"x-tp":"1"}, body: body ? JSON.stringify(body) : undefined, credentials:"same-origin"});
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok){ const err = new Error((j && j.error) || "Something went wrong."); err.status = r.status; err.upgrade = j && j.upgrade; throw err; }
  return j;
}
const isPro = () => MODE!=="cloud" || !!(VENUE && VENUE.plan==="pro");
const canManage = () => MODE!=="cloud" || !!(VENUE && VENUE.role!=="staff");
function hash(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
/* The bar's data as small documents, so two people editing different bottles never collide. */
const CAL = ["tare","fullH","shoulderH"];
function flatten(){
  const f = {cfg: JSON.stringify({target:S.settings.target, pour:S.settings.pour, beerTarget:S.settings.beerTarget, bar:S.settings.bar||""}), shelves: JSON.stringify(S.shelves||[])};
  (S.beers||[]).forEach(b=>{ f["b:"+b.id] = JSON.stringify(b); });
  S.products.forEach(p=>{ const d = Object.assign({},p), cal = {}; CAL.forEach(k=>{ if(d[k]!=null) cal[k]=d[k]; delete d[k]; });
    f["p:"+p.id] = JSON.stringify(d); if(Object.keys(cal).length) f["cal:"+p.id] = JSON.stringify(cal); });
  S.counts.forEach(c=>{ f["c:"+c.id] = JSON.stringify({date:c.date});
    Object.keys(c.items||{}).forEach(pid=>{ f["ci:"+c.id+":"+pid] = JSON.stringify(c.items[pid]); });
    Object.keys(c.beer||{}).forEach(bid=>{ f["cb:"+c.id+":"+bid] = JSON.stringify(c.beer[bid]); });
    new Set([...Object.keys(c.beerRecv||{}), ...Object.keys(c.beerSold||{})]).forEach(bid=>{ const r=(c.beerRecv||{})[bid]||0, sl=(c.beerSold||{})[bid]; if(r || sl!=null) f["cbx:"+c.id+":"+bid] = JSON.stringify({r, s: sl==null?null:sl}); });
    new Set([...Object.keys(c.purchases||{}), ...Object.keys(c.sales||{})]).forEach(pid=>{ const r=(c.purchases||{})[pid]||0, sl=(c.sales||{})[pid]; if(r || sl!=null) f["cx:"+c.id+":"+pid] = JSON.stringify({r, s: sl==null?null:sl}); });
  });
  return f;
}
function unflatten(f){
  const st = {settings:S.settings, products:[], beers:[], counts:[], shelves:[]}, cm = {}, pm = {};
  const J = k => { try{ return JSON.parse(f[k]); }catch(e){ return null; } };
  for(const k in f){ const v = J(k); if(v==null) continue;
    if(k==="cfg"){ if(v.target>0) st.settings.target=v.target; if(v.pour>0) st.settings.pour=v.pour; if(v.beerTarget>0) st.settings.beerTarget=v.beerTarget; if(typeof v.bar==="string") st.settings.bar=v.bar; }
    else if(k.startsWith("b:")) st.beers.push(v);
    else if(k==="shelves"){ if(Array.isArray(v)) st.shelves=v; }
    else if(k.startsWith("p:")){ pm[v.id]=v; st.products.push(v); }
    else if(k.startsWith("c:")){ const id=k.slice(2); cm[id] = {id, date:v.date, items:{}, purchases:{}, sales:{}, beer:{}, beerRecv:{}, beerSold:{}}; }
  }
  for(const k in f){ const [t,a,b] = k.split(":"), v = J(k); if(v==null) continue;
    if(t==="cal" && pm[a]) Object.assign(pm[a], v);
    else if(t==="ci" && cm[a]) cm[a].items[b]=v;
    else if(t==="cx" && cm[a]){ if(v.r) cm[a].purchases[b]=v.r; if(v.s!=null) cm[a].sales[b]=v.s; }
    else if(t==="cb" && cm[a]) cm[a].beer[b]=v;
    else if(t==="cbx" && cm[a]){ if(v.r) cm[a].beerRecv[b]=v.r; if(v.s!=null) cm[a].beerSold[b]=v.s; }
  }
  st.counts = Object.values(cm).filter(c=>c.date).sort((a,b)=>a.date-b.date);
  return st;
}
function loadShadow(){ const x = LS.get(KEY+".sync"); hardPull = !x; shadow = (x&&x.shadow)||{}; rev = (x&&x.rev)||0; }
function saveShadow(){ LS.set(KEY+".sync", {shadow, rev}); }
function pendingChanges(flat){
  const ch = [];
  for(const k in flat) if(shadow[k]!==hash(flat[k])) ch.push({k, v:flat[k]});
  for(const k in shadow) if(!(k in flat)) ch.push({k, v:null});
  return ch;
}
function scheduleSync(){ if(MODE!=="cloud") return; clearTimeout(syncT); syncT = setTimeout(syncNow, 700); paintSync(); }
function syncLabel(){
  if(MODE!=="cloud") return "";
  if(syncing) return "Syncing…";
  let n = 0; try{ n = hardPull ? 0 : pendingChanges(flatten()).length; }catch(e){}
  if(syncErr || !navigator.onLine) return n ? n+" waiting · offline" : "Offline";
  return n ? n+" waiting" : "Up to date";
}
function paintSync(){ const el = $("#syncStat"); if(el) el.textContent = syncLabel(); }
async function syncNow(){
  if(MODE!=="cloud" || !VENUE || syncing) return;
  if(!navigator.onLine){ syncErr = "offline"; paintSync(); return; }
  syncing = true; paintSync();
  const vid = VENUE.id;
  try{
    const sentFlat = flatten(), pull = hardPull;
    const changes = pull ? [] : pendingChanges(sentFlat);
    const r = await api("POST", `/api/venues/${vid}/sync`, {since: pull ? 0 : rev, changes});
    if(MODE!=="cloud" || !VENUE || VENUE.id!==vid) return;
    const rejected = new Map((r.rejected||[]).map(x=>[x.k, x.why]));
    let nowFlat = flatten(), touched = false;
    if(pull){
      shadow = {}; const srv = {};
      r.docs.forEach(d=>{ if(d.v==null) return; if(d.k.startsWith("ph:")) return; srv[d.k]=d.v; shadow[d.k]=hash(d.v); });
      if(Object.keys(srv).length){ nowFlat = srv; touched = true; }   // a brand-new bar has nothing to pull; keep local defaults and push them next
      hardPull = false;
    } else {
      changes.forEach(c=>{ if(rejected.has(c.k) || c.k.startsWith("ph:")) return; if(c.v==null) delete shadow[c.k]; else shadow[c.k]=hash(c.v); });
      r.docs.forEach(d=>{
        if(d.k.startsWith("ph:")) return;
        if(d.v==null) delete shadow[d.k]; else shadow[d.k]=hash(d.v);
        if(nowFlat[d.k]!==sentFlat[d.k]) return;                       // edited here while the request was in flight: keep it, it goes up next round
        if(d.v==null){ if(d.k in nowFlat){ delete nowFlat[d.k]; touched = true; } } else if(nowFlat[d.k]!==d.v){ nowFlat[d.k]=d.v; touched = true; }
      });
      let roleHit = false;
      rejected.forEach((why,k)=>{ if(why==="limit"){ delete nowFlat[k]; delete nowFlat["cal:"+k.slice(2)]; touched = true; toast("Free plan holds "+VENUE.limits.bottles+" bottles and beers. Upgrade to add more."); } else if(why==="role") roleHit = true; });
      if(roleHit){ hardPull = true; toast("Only managers can change that"); }
    }
    rev = r.rev;
    if(r.venue){ const was = VENUE.plan; Object.assign(VENUE, r.venue); LS.set("tallypour.me", ME); if(was!==VENUE.plan) touched = true; }
    if(touched){ S = unflatten(nowFlat); ensureShelves(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
    saveShadow(); syncErr = null;
    if(touched) render();
    if(hardPull || pendingChanges(flatten()).length) scheduleSync();
  }catch(e){
    if(e.status===401){ signedOut(); return; }
    if(e.status===404){ refreshMe(true); return; }
    syncErr = e.message || "offline";
  }finally{ syncing = false; paintSync(); }
}
async function flush(){ for(let i=0;i<60 && syncing;i++) await sleep(100); clearTimeout(syncT); await syncNow(); }
async function refreshMe(reenter){
  try{ ME = await api("GET","/api/me"); LS.set("tallypour.me", ME); }
  catch(e){ if(e.status===401) signedOut(); return; }
  if(!ME.venues.length){ showAuth("venue"); return; }
  const v = ME.venues.find(x=>VENUE && x.id===VENUE.id);
  if(!v || reenter) enterCloud(v ? v.id : null); else { Object.assign(VENUE, v); if(tab==="more") render(); }
}
function enterCloud(vid){
  MODE = "cloud"; LS.set("tallypour.mode","cloud");
  VENUE = ME.venues.find(v=>v.id===vid) || ME.venues.find(v=>v.id===LS.get("tallypour.venue")) || ME.venues[0];
  LS.set("tallypour.venue", VENUE.id);
  KEY = "tallypour.v."+VENUE.id; load(); loadShadow(); ensureShelves(); applyTheme();
  $("#auth").classList.remove("show"); arranging = false; landTab(); render(); syncNow();
  clearInterval(pollT); pollT = setInterval(()=>{ if(document.visibilityState==="visible") syncNow(); }, 20000);
}
/* Guest: the real app with no account, saved on this phone. Demo: a sample bar for showing people. They never share data. */
async function enterLocal(kind){
  MODE = kind; KEY = "tallypour."+kind; clearInterval(pollT);
  if(kind==="guest"){ LS.set("tallypour.mode","guest"); await migratePourCount(); }
  if(MODE!==kind) return;
  load();
  if(kind==="demo" && !S.products.length){ S = sample(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  ensureShelves(); applyTheme(); $("#auth").classList.remove("show"); arranging = false; landTab(); render();
  const mig = LS.get("tallypour.guest.from");
  if(kind==="guest" && mig && mig.bottles && !mig.shown){ mig.shown = 1; LS.set("tallypour.guest.from", mig); toast(`Brought over ${mig.bottles} bottles from PourCount`); }
}
const enterDemo = () => enterLocal("demo");
/* One time: copy the earlier PourCount app's data (same web address) into guest mode. The original is left untouched as a safety copy. */
async function migratePourCount(){
  if(LS.get("tallypour.guest.from")) return;
  let old = null, mine = null;
  try{ old = JSON.parse(localStorage.getItem("pourcount.v1")); }catch(e){}
  try{ mine = JSON.parse(localStorage.getItem("tallypour.guest")); }catch(e){}
  if(!(old && Array.isArray(old.products) && old.products.length) || (mine && Array.isArray(mine.products) && mine.products.length)){ LS.set("tallypour.guest.from", {at:Date.now(), bottles:0}); return; }
  try{ localStorage.setItem("tallypour.guest", JSON.stringify(old)); }catch(e){ return; }   // try again next launch
  LS.set("tallypour.guest.from", {at:Date.now(), bottles:old.products.length, counts:(old.counts||[]).length});
}
function guestData(){ try{ const g = JSON.parse(localStorage.getItem("tallypour.guest")); return g && Array.isArray(g.products) && g.products.length ? g : null; }catch(e){ return null; } }
/* After a guest creates an account, move her bottles and counts into the new bar. */
async function carryGuest(){
  const g = guestData(); if(!g || MODE!=="cloud" || S.products.length) return;
  S = g; S.settings = Object.assign(blank().settings, g.settings||{}); S.counts = S.counts||[]; ensureShelves(); save(); render();
  LS.set("tallypour.guest.movedTo", VENUE.id); scheduleSync(); render();
  toast(`Moved ${S.products.length} bottles into your account`);
}
function signedOut(){ MODE = "boot"; ME = null; VENUE = null; clearInterval(pollT); LS.del("tallypour.me"); LS.del("tallypour.mode"); showAuth("login"); }
window.addEventListener("online", ()=>syncNow());
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") syncNow(); });
async function boot(){
  const qs = new URLSearchParams(location.search);
  if(qs.get("demo")){ enterLocal("demo"); return; }
  const wasGuest = LS.get("tallypour.mode")==="guest" && !qs.get("invite") && !qs.get("reset");
  if(wasGuest) enterLocal("guest");                              // opens instantly, also offline
  try{ CFG = await api("GET","/api/config"); if(!CFG || CFG.app!=="tallypour") throw 0; LS.set("tallypour.hosted", 1); }
  catch(e){ CFG = null; if(!LS.get("tallypour.hosted")){ if(!wasGuest) enterLocal("guest"); return; } }   // no server (for example GitHub Pages): guest only
  if(wasGuest){ if(MODE==="guest" && tab==="more") render(); return; }
  ME = LS.get("tallypour.me");
  if(qs.get("reset")){ showAuth("reset"); return; }
  if(ME && ME.venues && ME.venues.length) enterCloud();          // instant start, also works offline
  try{ ME = await api("GET","/api/me"); LS.set("tallypour.me", ME); }
  catch(e){ if(e.status===401 || !ME){ ME = null; LS.del("tallypour.me"); MODE = "boot"; showAuth(); } return; }
  if(qs.get("invite")){ try{ const r = await api("POST","/api/invites/accept",{code:qs.get("invite")}); ME = {user:ME.user, venues:r.venues}; LS.set("tallypour.me", ME); enterCloud(r.venueId); toast("You joined the team"); }catch(e){ toast(e.message); } }
  if(qs.toString()){ try{ history.replaceState(null,"",location.pathname+location.hash); }catch(e){} }
  if(!ME.venues.length){ showAuth("venue"); return; }
  if(MODE!=="cloud") enterCloud(); else { const v = ME.venues.find(x=>x.id===VENUE.id); if(v){ Object.assign(VENUE, v); if(tab==="more") render(); } else enterCloud(); }
  if(qs.get("upgraded")) toast("Welcome to Pro");
}

/* ---------- sign-in screens ---------- */
let authMode = "login";
const LOGO = '<svg viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#4d86ff"/><path d="M17 6h6v7c0 2 5 4 5 10v9a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2v-9c0-6 5-8 5-10z" fill="#fff"/><path d="M15.5 22v8M18.5 22v8M21.5 22v8M24.5 22v8M14 29l12-6" stroke="#4d86ff" stroke-width="1.6" stroke-linecap="round"/></svg>';
function guestBtn(){ const g = guestData(); return `<button class="btn gray" style="margin-top:10px" data-a="guest">${g?`Back to My Bar Without an Account`:`Continue Without an Account`}</button><p class="an" style="margin-top:6px">${g?`${g.products.length} bottles saved on this phone.`:`Everything saves on this phone. Create an account any time to sync.`}</p>`; }
function showAuth(mode, err){
  const qs = new URLSearchParams(location.search), inv = qs.get("invite")||"";
  authMode = mode || (inv ? "join" : "login");
  const f = (id,label,type,ph,ac,v) => `<label class="af"><span>${label}</span><input id="${id}" type="${type}" placeholder="${ph}" autocomplete="${ac}" value="${esc(v||"")}" autocapitalize="${type==="text"&&id!=="auInvite"?"words":"none"}"></label>`;
  const days = (CFG && CFG.pricing.trialDays) || 14;
  const M = {
    login: () => f("auEmail","Email","email","you@yourbar.com","email") + f("auPass","Password","password","","current-password") +
      `<button class="btn" data-a="authGo">Sign In</button>${guestBtn()}<p class="as2"><button data-a="authMode" data-v="forgot">Forgot password?</button></p><p class="as2">New here? <button data-a="authMode" data-v="signup">Create a free account</button></p><p class="as2">Have an invite code? <button data-a="authMode" data-v="join">Join a team</button></p>`,
    signup: () => f("auName","Your name","text","Alex","name") + f("auVenue","Bar name","text","The Rusty Nail","organization") + f("auEmail","Email","email","you@yourbar.com","email") + f("auPass","Password","password","8 characters or more","new-password") +
      `<button class="btn" data-a="authGo">Create Free Account</button><p class="an">${guestData()?`Your ${guestData().products.length} bottles and counts from guest mode move into the new account. `:""}Free forever for one bar. Starts with a ${days}-day Pro trial. No card needed.</p>${guestBtn()}<p class="as2">Have an account? <button data-a="authMode" data-v="login">Sign in</button></p>`,
    join: () => f("auInvite","Invite code","text","From your manager","off",inv) + f("auName","Your name","text","Alex","name") + f("auEmail","Email","email","you@email.com","email") + f("auPass","Password","password","8 characters or more","new-password") +
      `<button class="btn" data-a="authGo">Join the Team</button><p class="an">Already have an account? Sign in, then open your invite link again.</p><p class="as2"><button data-a="authMode" data-v="login">Sign in</button></p>`,
    forgot: () => f("auEmail","Email","email","you@yourbar.com","email") + `<button class="btn" data-a="authGo">Send Reset Link</button><p class="as2"><button data-a="authMode" data-v="login">Back to sign in</button></p>`,
    reset: () => f("auPass","New password","password","8 characters or more","new-password") + `<button class="btn" data-a="authGo">Save New Password</button>`,
    venue: () => f("auVenue","Bar name","text","The Rusty Nail","organization") + `<button class="btn" data-a="authGo">Create Bar</button><p class="as2"><button data-a="signOut">Sign out</button></p>`
  };
  const tag = {login:"Bar inventory that takes minutes.", signup:"Set up your bar in under a minute.", join:"Join your bar's team.", forgot:"We'll email you a reset link.", reset:"Choose a new password.", venue:"Name your bar to get started."}[authMode];
  $("#authIn").innerHTML = `<div class="logo">${LOGO}Tallypour</div><p class="tag">${tag}</p>${M[authMode]()}<p class="aerr" id="auErr" role="alert">${esc(err||"")}</p>`;
  $("#auth").classList.add("show");
}
async function authGo(){
  const g = id => { const el = $("#"+id); return el ? el.value.trim() : ""; };
  const btn = $("#authIn .btn"); if(btn.disabled) return; btn.disabled = true; $("#auErr").textContent = "";
  try{
    let r;
    if(authMode==="login") r = await api("POST","/api/auth/login",{email:g("auEmail"), password:$("#auPass").value});
    else if(authMode==="signup") r = await api("POST","/api/auth/signup",{name:g("auName"), venueName:g("auVenue"), email:g("auEmail"), password:$("#auPass").value});
    else if(authMode==="join") r = await api("POST","/api/auth/signup",{name:g("auName"), invite:g("auInvite"), email:g("auEmail"), password:$("#auPass").value});
    else if(authMode==="forgot"){ await api("POST","/api/auth/forgot",{email:g("auEmail")}); showAuth("login","If that email has an account, a reset link is on its way."); return; }
    else if(authMode==="reset"){ await api("POST","/api/auth/reset",{token:new URLSearchParams(location.search).get("reset"), password:$("#auPass").value}); try{ history.replaceState(null,"",location.pathname); }catch(e){} showAuth("login","Password saved. Sign in with it now."); return; }

/* ---------- Bluetooth scales (Web Bluetooth: Chrome/Edge on Android, Windows, Mac, ChromeOS) ---------- */
const SCALES = [
  { id:"decent", name:"Decent Scale", filters:[{namePrefix:"Decent Scale"}], service:0xfff0, notify:0xfff4, write:0x36f5,
    parse(dv){ if(dv.byteLength<7 || dv.getUint8(0)!==0x03) return null; const t = dv.getUint8(1); if(t!==0xCE && t!==0xCA) return null; return {g: dv.getInt16(2,false)/10}; },
    tare:[0x03,0x0F,0x00,0x00,0x00,0x00,0x0C] },
  { id:"wss", name:"Bluetooth scale", filters:[{services:[0x181d]}], service:0x181d, notify:0x2a9d, oneShot:true,
    parse(dv){ if(dv.byteLength<3) return null; const fl = dv.getUint8(0), raw = dv.getUint16(1,true); return {g: (fl&1) ? raw*0.01*453.59237 : raw*5}; } }
];
let bt = {dev:null, drv:null, svc:null, g:null, stable:false, hist:[], status:"off", retries:0};
const btG = () => bt.g==null ? null : Math.round(bt.g*10)/10;
const btLabel = () => bt.status==="on" ? `${bt.drv.name}${bt.g!=null?" · "+Math.round(bt.g)+" g":""}` : bt.status==="connecting" ? "Connecting…" : "Not paired";
function btBarIn(){
  if(bt.status==="on"){ const p = ct && prod(ct.id), cal = p && !(p.tare>0);
    return `<span class="btdot ${bt.stable?"ok":""}"></span><b class="num">${bt.g==null?"—":btG()+" g"}</b><span>${bt.stable?"Stable":"Reading…"} · ${esc(bt.drv.name)}</span>${cal?`<button class="lbtn" data-a="btInto" data-v="calTare">Use as Empty</button><button class="lbtn" data-a="btInto" data-v="calFull">Use as Sealed</button>`:""}`; }
  if(bt.status==="connecting") return `<span class="btdot"></span><span>Connecting to the scale…</span>`;
  return `<button class="lbtn" data-a="btPair">${mi("scale")}Pair Bluetooth Scale${isPro()?"":' <span class="pill pro">PRO</span>'}</button>`;
}
const btBar = () => `<div id="btBar" class="btbar">${btBarIn()}</div>`;
function btPaint(){
  const s = $("#btStat"); if(s) s.textContent = btLabel();
  const b = $("#btBar"); if(b) b.innerHTML = btBarIn();
  const raw = $("#raw");
  if(raw && ct && ct.method==="scale" && bt.status==="on" && bt.g!=null && bt.g>=5 && document.activeElement!==raw && raw.value!==String(btG())){ raw.value = btG(); dirty = true; updateGauge(); }
}
async function btPair(){
  if(!isPro()){ upgradeSheet("Bluetooth scale pairing"); return; }
  if(bt.status==="on"){ actionSheet(bt.drv.name+" is connected", [{label:"Zero the Scale", fn:btTare},{label:"Disconnect", d:true, fn:btOff}]); return; }
  if(!navigator.bluetooth){ infoSheet("Bluetooth Scale","Pairing works in <b>Chrome or Edge</b> on Android, Windows, Mac and Chromebook. iPhone and iPad browsers don't allow Bluetooth yet, so type the weight from your scale's display instead.<br><br>Supported today: the Decent Scale and scales that use the standard Bluetooth weight service."); return; }
  try{
    const dev = await navigator.bluetooth.requestDevice({filters: SCALES.flatMap(x=>x.filters), optionalServices: SCALES.map(x=>x.service)});
    bt.dev = dev; dev.addEventListener("gattserverdisconnected", btLost); await btConnect();
  }catch(e){ bt.status = "off"; btPaint(); if(!e || e.name!=="NotFoundError") toast(e && e.message==="unsupported" ? "That scale isn't supported yet" : "Couldn't connect to the scale"); }
}
async function btConnect(){
  bt.status = "connecting"; btPaint();
  const gatt = await bt.dev.gatt.connect(); let found = null;
  for(const d of SCALES){ try{ const svc = await gatt.getPrimaryService(d.service), ch = await svc.getCharacteristic(d.notify); found = {d, svc, ch}; break; }catch(e){} }
  if(!found){ try{ gatt.disconnect(); }catch(e){} throw new Error("unsupported"); }
  bt.drv = found.d; bt.svc = found.svc; bt.hist = []; bt.g = null; bt.stable = false;
  found.ch.addEventListener("characteristicvaluechanged", ev=>btRead(ev.target.value));
  await found.ch.startNotifications();
  bt.status = "on"; bt.retries = 0; toast(found.d.name+" connected"); btPaint();
}
function btRead(dv){
  const r = bt.drv.parse(dv); if(!r || !isFinite(r.g)) return;
  const t = Date.now(); bt.hist.push([t, r.g]); bt.hist = bt.hist.filter(x=>t-x[0]<1200);
  const gs = bt.hist.map(x=>x[1]);
  bt.stable = bt.drv.oneShot ? true : (bt.hist.length>=3 && Math.max(...gs)-Math.min(...gs)<=1.5 && t-bt.hist[0][0]>=500);
  bt.g = r.g; btPaint();
}
function btLost(){
  if(bt.status==="off") return;
  bt.status = "connecting"; bt.g = null; bt.stable = false; btPaint();
  if(bt.retries++ < 3) setTimeout(()=>btConnect().catch(()=>btLost()), 1500); else { bt.status = "off"; btPaint(); toast("Scale disconnected"); }
}
function btOff(){ bt.status = "off"; try{ bt.dev && bt.dev.gatt.disconnect(); }catch(e){} bt.dev = null; btPaint(); }
async function btTare(){ try{ if(!bt.drv.tare) throw 0; const ch = await bt.svc.getCharacteristic(bt.drv.write); await ch.writeValue(new Uint8Array(bt.drv.tare)); toast("Scale zeroed"); }catch(e){ toast("Use the zero button on the scale"); } }

function density(p){ return p.density>0 ? p.density : (CATS[p.cat]||.97); }
function calc(p){
  const bOz = (p.ml||0)/OZ;
  const costOz = bOz>0 ? (p.cost||0)/bOz : 0;
  const pour = p.pour>0 ? p.pour : S.settings.pour;
  const costPour = costOz*pour;
  const pc = p.price>0 ? costPour/p.price*100 : null;
  const suggested = costPour/(S.settings.target/100);

/* scale: oz left from gross weight */
function scaleOz(p,g){ if(!(p.tare>0)||!(g>0)) return null; return clamp((g-p.tare)/density(p)/OZ,0,calc(p).bOz); }
/* tape: oz left from liquid height (cm). Body = cylinder up to shoulder, then a frustum tapering to the neck. */
function tapeOz(p,h){
  if(!(p.fullH>0)||!(h>=0)) return null;
  const b = p.baseH||0, H = p.fullH-b; if(H<=0) return null;
  const Sh = clamp((p.shoulderH>0?p.shoulderH:p.fullH)-b,0,H), L=H-Sh, k=TAPER_K, a=1-k;
  const x = clamp(h-b,0,H);
  const vt = L>0 ? (L/3)*(1+k+k*k) : 0, total = Sh+vt;
  let v; if(x<=Sh) v=x; else { const t=x-Sh; v = Sh + (L/(3*a))*(1-Math.pow(1-a*t/L,3)); }
  return calc(p).bOz * v/total;
}

document.addEventListener("pointerdown",e=>{
  const b = e.target.closest(".arranging .btl[data-id]"); if(!b) return;
  const x0=e.clientX, y0=e.clientY;
  holdT = setTimeout(()=>{
    const r = b.getBoundingClientRect(), fl = b.cloneNode(true);
    fl.classList.add("drag-float"); fl.style.left=x0+"px"; fl.style.top=y0+"px"; fl.style.width=r.width+"px";
    document.body.appendChild(fl); b.classList.add("ghost");
    drag = {el:b, fl, x:x0, y:y0}; try{ navigator.vibrate && navigator.vibrate(12); }catch(_){}
    tick();
  }, 220);
  const cancelHold = ev=>{ if(!drag && Math.hypot(ev.clientX-x0,ev.clientY-y0)>8){ clearTimeout(holdT); } };
  document.addEventListener("pointermove",cancelHold,{once:false});
  const up = ()=>{ clearTimeout(holdT); document.removeEventListener("pointermove",cancelHold); document.removeEventListener("pointerup",up); document.removeEventListener("pointercancel",up); };
  document.addEventListener("pointerup",up); document.addEventListener("pointercancel",up);
});
document.addEventListener("touchmove",e=>{ if(drag) e.preventDefault(); },{passive:false});

  if(!drag) return;
  drag.x=e.clientX; drag.y=e.clientY; drag.fl.style.left=e.clientX+"px"; drag.fl.style.top=e.clientY+"px";
  const under = document.elementFromPoint(e.clientX,e.clientY), row = under && under.closest(".shelf-row");
  if(!row) return;
  const kids = [...row.querySelectorAll(".btl[data-id]")].filter(k=>k!==drag.el);
  const before = kids.find(k=>{ const r=k.getBoundingClientRect(); return e.clientX < r.left+r.width/2; });
  const emp = row.querySelector(".empty-slot"); if(emp) emp.remove();

const normCode = c => { const d=String(c||"").replace(/\D/g,""); return d.length===12 ? "0"+d : d; };  // UPC-A and EAN-13 read the same

async function getDetector(){

  try{ if("BarcodeDetector" in window){ const sup = await BarcodeDetector.getSupportedFormats(); if(sup && sup.some(f=>formats.includes(f))) return new BarcodeDetector({formats: formats.filter(f=>sup.includes(f))}); } }catch(e){}

    window.BarcodeDetectionAPI.prepareZXingModule({overrides:{locateFile:(path,prefix)=> path.endsWith(".wasm") ? new URL("vendor/"+path, location.href).href : prefix+path}});
  }
  return new window.BarcodeDetectionAPI.BarcodeDetector({formats});
}
async function startScan(onCode){
  $("#scanner").classList.add("show"); $("#scanManual").value=""; $("#scanMsg").textContent="Starting camera…";
  scan = {onCode, stream:null, stop:false};
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!scan || scan.stop){ stream.getTracks().forEach(t=>t.stop()); return; }
    scan.stream = stream; const v=$("#scanVideo"); v.srcObject=stream; await v.play();
    $("#scanMsg").textContent="Line up the barcode inside the box";
    const det = await getDetector(); const sc = scan;
    const loop = async ()=>{
      if(!scan || sc.stop || scan!==sc) return;
      try{ const r = await det.detect(v); const code = r && r[0] && r[0].rawValue; if(code){ try{ navigator.vibrate&&navigator.vibrate(30); }catch(_){} stopScan(); onCode(code); return; } }catch(e){}
      setTimeout(loop, 180);
    };
    loop();
  }catch(e){
    $("#scanMsg").textContent = "Camera isn't available. Allow camera access, or type the barcode number below.";
  }
}
function stopScan(){ if(!scan) return; scan.stop=true; if(scan.stream) scan.stream.getTracks().forEach(t=>t.stop()); const v=$("#scanVideo"); v.srcObject=null; scan=null; $("#scanner").classList.remove("show"); }
function guessCat(text){
  const t = norm(text);
  const map = [["cream","Cream Liqueur"],["vodka","Vodka"],["gin","Gin"],["rum","Rum"],["ron ","Rum"],["mezcal","Mezcal"],["tequila","Tequila"],["bourbon","Whiskey"],["whisk","Whiskey"],["scotch","Whiskey"],["rye","Whiskey"],["cognac","Brandy"],["brandy","Brandy"],["vermouth","Vermouth"],["liqueur","Liqueur"],["liquor","Liqueur"],["amaro","Liqueur"],["wine","Wine"]];
  const hit = map.find(([k])=>t.includes(k)); return hit ? hit[1] : null;
}
function parseMl(q){
  const m = String(q||"").replace(",",".").match(/(\d+(?:\.\d+)?)\s*(ml|cl|l|lt|liters?|litres?|fl\.?\s*oz)\b/i); if(!m) return null;

async function lookupBarcode(code){
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), 7000);

    if(!r.ok) return null; const j = await r.json(); if(!j || j.status!==1 || !j.product) return null;
    const pr = j.product, brand = (pr.brands||"").split(",")[0].trim(), pname = (pr.product_name_en||pr.product_name||"").trim();

function bottleSvg(frac){

function render(){

  $("#navT").textContent = titles[tab];
  $("#navR").innerHTML = tab==="products" && canManage() ? `<button class="navbtn" data-a="${isBeer()?"addBeer":"addProduct"}" aria-label="Add">${I.plus}</button>` : tab==="reports" && (S.products.length||S.beers.length) ? `<button class="navbtn" data-a="exportSheet" style="font-weight:600">Export</button>` : "";

function vProducts(){
  if(!S.products.length) return `<h1 class="large">Bottles</h1>
    <div class="empty">${I.bottle}<h3>No bottles yet</h3>Three steps: add your bottles, count them, then check Reports. Start with one bottle and its cost and menu price.</div>
    <button class="btn" data-a="addProduct">Add a bottle</button><div class="spacer"></div>
    <button class="btn gray" data-a="loadSample">Load a sample bar</button>`;
  const ps = S.products.map(p=>calc(p).pc).filter(x=>x!=null);
  const avg = ps.length? ps.reduce((a,b)=>a+b,0)/ps.length : null;
  const over = ps.filter(x=>x>S.settings.target).length;
  return `<h1 class="large">Bottles${canManage()?`<button class="deskadd" data-a="addProduct">${I.plus}Add bottle</button>`:""}</h1>
  <div class="sub">${S.products.length} bottles · avg pour cost <span class="${pcClass(avg)}">${avg==null?"—":f1(avg)+"%"}</span>${over?` · <span class="bad">${over} over target</span>`:""}</div>
  <div class="legend"><span style="color:var(--ter)">Pour cost:</span><span><i class="dot bg-ok"></i>On target</span><span><i class="dot bg-warn"></i>Close</span><span><i class="dot bg-bad"></i>Over</span><span><i class="dot bg-none"></i>No price</span></div>
  ${viewSeg()}
  ${S.settings.view==="shelf" ? shelvesView("products") : `<div class="spacer" style="height:10px"></div><div class="search">${I.search}<input id="q" type="search" placeholder="Search" value="${esc(query)}" autocomplete="off"></div>
  <div class="spacer" style="height:10px"></div>
  <div id="plist">${productList()}</div>`}`;
}
function productList(){
  const q = query.trim().toLowerCase();
  const list = sortedProducts().filter(p=>!q||p.name.toLowerCase().includes(q)||(p.cat||"").toLowerCase().includes(q));
  if(!list.length) return `<div class="empty">No matches</div>`;
  let html="", cat=null;
  list.forEach(p=>{
    if(p.cat!==cat){ if(cat!==null) html+="</div>"; cat=p.cat; html+=`${catH(cat)}<div class="group">`; }
    const c = calc(p), cls = pcClass(c.pc);
    const lc = curCount(), le = lc && lc.items[p.id];
    html += `<div class="row tap" data-a="editProduct" data-v="${p.id}">
      ${thumb(p, le&&c.bOz ? le.open/c.bOz : 1)}
      <div class="main"><div class="name">${esc(p.name)}</div><div class="meta num">${sizeLabel(p.ml)} · ${money(p.cost)} · ${f1(c.pour)} oz pour</div></div>
      <div class="val num"><b>${money(c.costPour)} <span style="font-weight:400;color:var(--sec);font-size:13px">/ pour</span></b><small class="${cls}">${c.pc==null?"no price":(cls==="bad"?"▲ ":"")+f1(c.pc)+"% cost"}</small></div>${I.chev}</div>`;
  });
  return html+"</div>";
}

  edit.cost = num(g("cost")); edit.pour = num(g("pour")); edit.price = num(g("price"));
  edit.density = num(g("density")); const shv = g("shelf"); if(shv) edit.shelf = shv; edit.barcode = normCode(g("barcode")) || null;
  edit.par = num(g("par")); edit.vendor = g("vendor").trim() || null;
  const full = num(g("full")); let tare = num(g("tare"));
  edit._fromFull = false;
  if(!(tare>0) && full>0 && edit.ml>0){ tare = full - edit.ml*density(edit); edit._fromFull = true; }
  edit.tare = tare>0 ? Math.round(tare) : NaN;
  ["fullH","shoulderH","baseH"].forEach(k=>{ const v=num(g(k)); edit[k] = v>=0 ? v*tf : NaN; });
}

function saveProduct(){
  readDraft();

  if(!(edit.ml>0)){ toast("Add a bottle size"); return; }

  if(p.cost==null) p.cost = 0;

}

/* ---------- Count ---------- */
function vCount(){
  const c = curCount();
  if(!S.products.length) return `<h1 class="large">Count</h1><div class="empty">${I.scale}<h3>Add bottles first</h3>Your count list is built from your products.</div><button class="btn" data-a="tab" data-v="products">Go to Bottles</button>`;

    html += shelvesView("count") + `<div class="spacer" style="height:28px"></div><div class="group"><button class="row center" style="width:100%" data-a="newCount">Start New Count</button></div>

    const e = c.items[p.id], cc = calc(p);
    const meta = e ? `${f1(e.open)} oz open · ${e.sealed||0} sealed` : `Not counted · ${sizeLabel(p.ml)}`;
    html += `<div class="row tap" data-a="countItem" data-v="${p.id}">
      <span class="check ${e?"done":"todo"}">${e?I.tick:""}</span>
      ${thumb(p, e&&cc.bOz ? e.open/cc.bOz : null)}
      <div class="main"><div class="name">${esc(p.name)}</div><div class="meta num">${meta}</div></div>
      <div class="val num">${e?`<b>${f1(totalOz(p,e))} oz</b><small>${money(totalOz(p,e)*cc.costOz)}</small>`:""}</div>${I.chev}</div>`;
  });
  html += `</div><div class="spacer" style="height:28px"></div><div class="group"><button class="row center" style="width:100%" data-a="newCount">Start New Count</button></div>
  <div class="sec-f">Starting a new count keeps this one as the starting point for usage and variance.</div>`;
  return html;
}

let ct = null; // count draft
function countSheet(id){
  const p = prod(id), c = curCount(); if(!p||!c) return;
  const e = c.items[id];
  ct = {id, recv:(c.purchases||{})[id]||0, method: e?e.method:S.settings.method, sealed: e?e.sealed||0:0, raw: e?e.raw:"", tenths: e&&e.method==="eyeball"?e.raw:10};
  if(ct.method==="scale" && !(p.tare>0) && !e) ct.method = p.fullH>0?"tape":"eyeball";
  drawCountSheet();
}
function drawCountSheet(){
  const p = prod(ct.id), tu=S.settings.tape;
  const M = {scale:"Scale",tape:"Tape",eyeball:"Eyeball"};
  let panel="";
  if(ct.method==="scale"){
    panel = p.tare>0
      ? `<div class="bigin"><input id="raw" inputmode="decimal" placeholder="0" value="${esc(ct.raw)}"><span>g</span></div>
         <div class="hint num">Empty ${Math.round(p.tare)} g · Full ≈ ${Math.round(p.tare+p.ml*density(p))} g</div>`
      : `<div class="sec-h">Calibrate once</div><div class="group">
         <div class="row hi">${ic("scale")}<label>Empty bottle</label><input id="calTare" inputmode="decimal" placeholder="weight"><span class="unit">g</span></div>
         <div class="row hi">${ic("box")}<label>…or sealed</label><input id="calFull" inputmode="decimal" placeholder="weight"><span class="unit">g</span></div></div>
         <div class="sec-f">Saved to this bottle so you only do it once.</div>
         <div class="bigin"><input id="raw" inputmode="decimal" placeholder="0" value="${esc(ct.raw)}"><span>g</span></div><div class="hint">Weight of the open bottle, in grams</div>`;
  } else if(ct.method==="tape"){
    panel = (p.fullH>0 ? "" : `<div class="sec-h">Calibrate once (${tu})</div><div class="group">
         <div class="row hi">${ic("ruler")}<label>Full fill line</label><input id="calFullH" inputmode="decimal" placeholder="height"><span class="unit">${tu}</span></div>
         <div class="row hi">${ic("height")}<label>Shoulder</label><input id="calShH" inputmode="decimal" placeholder="optional"><span class="unit">${tu}</span></div></div>
         <div class="sec-f">Measured from the bar top on a sealed bottle. Saved to this bottle.</div>`)
      + `<div class="bigin"><input id="raw" inputmode="decimal" placeholder="0.0" value="${ct.raw!==""&&ct.raw!=null?+(ct.raw/tapeF()).toFixed(2):""}"><span>${tu}</span></div>
         <div class="hint">Liquid level, measured from the bar top</div>`;
  } else {
    panel = `<div class="group" style="padding:14px 16px 8px;margin-top:14px"><input id="tenths" type="range" min="0" max="10" step="1" value="${ct.tenths}"><div class="ticks"><span>Empty</span><span>½</span><span>Full</span></div></div>
      <div class="hint">Drag to the liquid level in tenths of the bottle</div>`;
  }
  if(ct.method==="scale") panel = btBar() + panel;
  openSheet(`
  <div class="sh-head"><button class="l" data-a="closeSheet">Cancel</button><div class="t">${esc(p.name)}</div><button class="r" data-a="saveCount" data-v="0">Save</button></div>
  <div class="sh-body">
    <div class="gauge" id="gauge"></div>
    <div class="seg">${Object.keys(M).map(k=>`<button class="${k===ct.method?"on":""}" data-a="method" data-v="${k}">${mi({scale:"scale",tape:"ruler",eyeball:"eye"}[k])}${M[k]}</button>`).join("")}</div>
    ${panel}
    <div class="sec-h">Sealed Bottles</div>
    <div class="group"><div class="row hi">${ic("box")}<div class="main">Full, unopened</div>
      <div class="stepper"><button data-a="sealed" data-v="-1" aria-label="Fewer">−</button><input id="sealed" inputmode="numeric" value="${ct.sealed}"><button data-a="sealed" data-v="1" aria-label="More">+</button></div></div></div>
    ${prevCount()?`<div class="sec-h">Received Since ${fmtDay(prevCount().date)}</div>
    <div class="group"><div class="row hi">${ic("truck")}<div class="main">Bottles delivered</div>
      <div class="stepper"><button data-a="step" data-v="recv:-1" aria-label="Fewer">−</button><input id="recv" inputmode="numeric" value="${ct.recv}"><button data-a="step" data-v="recv:1" aria-label="More">+</button></div></div></div>
    <div class="sec-f">Used to work out usage. Still include them in the sealed tally if they are on the shelf.</div>`:""}
    <div class="spacer" style="height:24px"></div>
    <button class="btn" data-a="saveCount" data-v="1">Save &amp; Next</button>
    ${curCount().items[ct.id]?`<div class="spacer"></div><button class="btn gray" style="color:var(--red)" data-a="clearCount">Clear This Count</button>`:""}
  </div>`);
  const r = $("#raw"); if(r && !("ontouchstart" in window)) r.focus();
  updateGauge();
}
function readCount(){
  const p = prod(ct.id);
  const sEl = $("#sealed"); ct.sealed = Math.max(0, Math.round(num(sEl?sEl.value:0))||0);
  const rEl = $("#recv"); if(rEl) ct.recv = Math.max(0, Math.round(num(rEl.value))||0);
  let open = null, tmp = Object.assign({},p);
  if(ct.method==="scale"){
    const ta=$("#calTare"), fu=$("#calFull");
    if(ta||fu){ let t=num(ta.value); if(!(t>0)&&num(fu.value)>0) t = num(fu.value)-p.ml*density(p); tmp.tare = t>0?t:null; }
    ct.raw = $("#raw").value; open = scaleOz(tmp, num(ct.raw));
  } else if(ct.method==="tape"){
    const fh=$("#calFullH"), sh=$("#calShH");
    if(fh){ tmp.fullH = num(fh.value)>0?num(fh.value)*tapeF():null; tmp.shoulderH = num(sh.value)>0?num(sh.value)*tapeF():null; }
    const v = num($("#raw").value); ct.raw = v>=0? v*tapeF() : ""; open = ct.raw===""?null:tapeOz(tmp, ct.raw);
  } else {
    ct.tenths = +$("#tenths").value; ct.raw = ct.tenths; open = calc(p).bOz*ct.tenths/10;
  }
  return {open, tmp};
}
function updateGauge(){
  const p = prod(ct.id), {open} = readCount(), c = calc(p);
  const frac = open!=null && c.bOz ? open/c.bOz : 0;
  const tot = (open||0)+ct.sealed*c.bOz;
  $("#gauge").innerHTML = `${bottleSvg(frac)}<div><div class="big num">${open==null?"—":f1(open)}<span> oz open</span></div>
    <div class="m num">${open==null?"Enter a reading":Math.round(frac*100)+"% · "+(c.pour?Math.floor(open/c.pour):0)+" pours · "+money(open*c.costOz)}</div>
    <div class="m num">Total on hand ${f1(tot)} oz · ${money(tot*c.costOz)}</div></div>`;
}
function saveCount(next){
  const p = prod(ct.id), {open, tmp} = readCount();
  if(open==null){ toast(ct.method==="scale"?(tmp.tare>0?"Enter the weight":"Add an empty or sealed weight"):ct.method==="tape"?(tmp.fullH>0?"Enter the level":"Add the full fill line"):"Set a level"); return; }
  if(ct.method==="scale" && tmp.tare>0 && !(p.tare>0)) p.tare = Math.round(tmp.tare);
  if(ct.method==="tape" && tmp.fullH>0 && !(p.fullH>0)){ p.fullH = tmp.fullH; p.shoulderH = tmp.shoulderH; }
  const c = curCount();
  c.items[ct.id] = {sealed:ct.sealed, open:+open.toFixed(2), method:ct.method, raw:ct.raw};
  if(prevCount()){ c.purchases = c.purchases||{}; if(ct.recv>0) c.purchases[ct.id]=ct.recv; else delete c.purchases[ct.id]; }
  S.settings.method = ct.method; save();
  if(next){
    const list = orderedProducts(), i = list.findIndex(x=>x.id===ct.id);
    const n = list.slice(i+1).find(x=>!c.items[x.id]) || list.find(x=>!c.items[x.id]);
    render();
    if(n){ countSheet(n.id); toast("Saved"); return; }
    closeSheet(); toast("Count complete"); return;
  }
  closeSheet(); render(); toast("Saved");
}

/* ---------- Reports ---------- */
function usageRows(){
  const c = curCount(), pv = prevCount(); if(!c||!pv) return null;
  const rows = [];
  sortedProducts().forEach(p=>{
    const a = totalOz(p,pv.items[p.id]), b = totalOz(p,c.items[p.id]);
    const cc = calc(p), purch = (c.purchases||{})[p.id]||0, sold = (c.sales||{})[p.id];
    if(a==null && !purch) return;
    const used = b==null ? null : (a||0) + purch*cc.bOz - b;
    const exp = sold!=null ? sold*cc.pour : null;
    const v = used!=null && exp!=null ? used-exp : null;
    rows.push({p,cc,start:a||0,end:b,purch,sold,used,exp,v,usedCost:used!=null?used*cc.costOz:null,vCost:v!=null?v*cc.costOz:null,rev:sold!=null&&p.price>0?sold*p.price:null});
  });
  return rows;
}
function vReports(){
  let html = `<h1 class="large">Reports</h1><div class="seg" style="margin-bottom:6px">${[["value","Value"],["usage","Usage"],["pricing","Pricing"],["order","Order"]].map(([k,l])=>`<button class="${k===rseg?"on":""}" data-a="rseg" data-v="${k}">${l}</button>`).join("")}</div>`;
  if(!S.products.length) return html+`<div class="empty">Add bottles to see reports.</div>`;
  if(rseg==="pricing"){
    const list = S.products.map(p=>({p,c:calc(p)})).sort((a,b)=>(b.c.pc??-1)-(a.c.pc??-1));
    const over = list.filter(x=>x.c.pc!=null && x.c.pc>S.settings.target);
    html += `<div class="sec-h">Target pour cost ${S.settings.target}%</div><div class="group">`;
    list.forEach(({p,c})=>{ const cls=pcClass(c.pc);
      html += `<div class="row tap" data-a="editProduct" data-v="${p.id}"><span class="dot bg-${cls}"></span>
      <div class="main"><div class="name">${esc(p.name)}</div><div class="meta num">${money(c.costPour)} cost · ${p.price>0?money(p.price)+" price":"no price"}${c.pc!=null&&c.pc>S.settings.target?` · <span class="warn">raise to ${money(Math.ceil(c.suggested*4)/4)}</span>`:""}</div></div>
      <div class="val num"><b class="${cls}">${c.pc==null?"—":f1(c.pc)+"%"}</b><small>${c.profit!=null?money(c.profit)+" margin":""}</small></div></div>`; });
    html += `</div><div class="sec-f">${over.length?`${over.length} bottle${over.length>1?"s are":" is"} above target. Suggested prices are rounded up to the nearest quarter.`:"Everything is at or under target."}</div>`;
    return html;
  }
  const c = curCount();
  if(rseg==="order"){
    if(!isPro()) return html+locked("Order list","Set a par level on each bottle and Tallypour tells you exactly what to order after every count.");
    if(!c) return html+`<div class="empty">Run a count to build your order list.</div><button class="btn" data-a="newCount">Start Count</button>`;
    const rows = [], noPar = S.products.filter(p=>!(p.par>0)).length; let est = 0;
    S.products.forEach(p=>{ const t = totalOz(p,c.items[p.id]), cc = calc(p); if(!(p.par>0) || t==null || !cc.bOz) return; const have = t/cc.bOz, need = Math.max(0, Math.ceil(p.par-have)); if(need){ rows.push({p,have,need}); est += need*(p.cost||0); } });
    rows.sort((a,b)=>(a.p.cat||"").localeCompare(b.p.cat||"")||a.p.name.localeCompare(b.p.name));
    html += `<div class="spacer" style="height:10px"></div><div class="hero"><div class="k">To order · from the ${fmtDay(c.date)} count</div><div class="v num">${rows.reduce((n,r)=>n+r.need,0)} <span style="font-size:20px;color:var(--sec);font-weight:600">bottles · about ${money0(est)}</span></div></div>`;
    if(rows.length){
      html += `<div class="spacer"></div><button class="btn" data-a="copyOrder">Copy Order List</button><div class="sec-h">Below Par</div><div class="group">` + rows.map(r=>`<div class="row tap" data-a="editProduct" data-v="${r.p.id}">${thumb(r.p, null)}<div class="main"><div class="name">${esc(r.p.name)}</div><div class="meta num">${f1(r.have)} on hand · par ${r.p.par}</div></div><div class="val num"><b>Order ${r.need}</b><small>${money(r.need*(r.p.cost||0))}</small></div></div>`).join("") + `</div>`;
    } else html += `<div class="empty">Nothing is below par.</div>`;
    return html + (noPar ? `<div class="sec-f">${noPar} bottle${noPar>1?"s have":" has"} no par level yet. Open a bottle and set one to include it here.</div>` : "");
  }
  if(rseg==="usage" && !isPro()) return html+locked("Usage and variance","Compare two counts with what your POS rang up, and see which bottles are losing money to over-pouring, comps or theft.");
  if(rseg==="value"){
    if(!c) return html+`<div class="empty">Run a count to see on-hand value.</div><button class="btn" data-a="newCount">Start Count</button>`;
    let total=0, cats={}, items=[];
    S.products.forEach(p=>{ const t=totalOz(p,c.items[p.id]); if(t==null) return; const v=t*calc(p).costOz; total+=v; cats[p.cat]=(cats[p.cat]||0)+v; items.push({p,t,v}); });
    html += `<div class="spacer" style="height:10px"></div><div class="hero"><div class="k">On-hand value · ${fmtDate(c.date)}</div><div class="v num">${money(total)}</div><div class="m">${items.length} of ${S.products.length} bottles counted</div></div>`;
    html += `<div class="sec-h">By Category</div><div class="group">` + Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).map(k=>`<div class="row hi">${ic("bottle",CATC[k]||CATC.Other,1)}<div class="main">${esc(k)}</div><div class="val num"><b>${money(cats[k])}</b></div></div>`).join("") + `</div>`;
    html += `<div class="sec-h">By Bottle</div><div class="group">` + items.sort((a,b)=>b.v-a.v).map(x=>`<div class="row"><div class="main"><div class="name">${esc(x.p.name)}</div><div class="meta num">${f1(x.t)} oz · ${f1(x.t/calc(x.p).bOz)} bottles</div></div><div class="val num"><b>${money(x.v)}</b></div></div>`).join("") + `</div>`;
    return html;
  }
  // usage
  const rows = usageRows();
  if(!rows) return html+`<div class="empty"><h3>Needs two counts</h3>Usage is the difference between two counts plus what you received. Finish this count, then start a new one next shift or week.</div>${c?`<button class="btn" data-a="tab" data-v="count">Go to Count</button>`:""}`;
  let used=0, vcost=0, rev=0, revCost=0, any=false;
  rows.forEach(r=>{ if(r.usedCost!=null) used+=r.usedCost; if(r.vCost!=null){ vcost+=r.vCost; any=true; } if(r.rev!=null&&r.usedCost!=null){ rev+=r.rev; revCost+=r.usedCost; } });
  const actual = rev>0 ? revCost/rev*100 : null;
  html += `<div class="spacer" style="height:10px"></div><div class="stats num">
    <div><div class="k">${mi("chart",GC.chart)}Usage cost</div><div class="v">${money0(used)}</div></div>
    <div><div class="k">${mi("percent",GC.percent)}Actual pour cost</div><div class="v ${pcClass(actual)}">${actual==null?"—":f1(actual)+"%"}</div></div>
    <div><div class="k">${mi("alert",GC.alert)}Variance (loss)</div><div class="v ${any?(vcost>used*.05?"bad":vcost>0?"warn":"ok"):""}">${any?money0(vcost):"—"}</div></div>
    <div><div class="k">${mi("menu",GC.menu)}Sales</div><div class="v">${rev>0?money0(rev):"—"}</div></div></div>
    <div class="sec-f">${fmtDay(prevCount().date)} → ${fmtDay(c.date)}. Tap a bottle to enter pours sold from your POS and see what is unaccounted for.</div>`;
  html += `<div class="sec-h">By Bottle</div><div class="group">`;
  rows.sort((a,b)=>(b.vCost??-1e9)-(a.vCost??-1e9)||(b.usedCost||0)-(a.usedCost||0)).forEach(r=>{
    const vp = r.v!=null&&r.exp>0 ? r.v/r.exp*100 : null;
    const cls = r.v==null?"":vp!=null&&vp>10?"bad":r.v>0.5?"warn":"ok";
    const meta = r.used==null ? "Not counted this time" : `Used ${f1(r.used)} oz${r.purch?` · +${r.purch} recv`:""}${r.sold!=null?` · ${r.sold} sold`:""}`;

function bcalc(b){
  const per = b.per>0 ? b.per : 24, unit = per>0 ? (b.caseCost||0)/per : 0, t = S.settings.beerTarget;
  const pc = b.price>0 ? unit/b.price*100 : null;
  return {per, unit, pc, suggested:unit/(t/100), profit:b.price>0?b.price-unit:null, caseProfit:b.price>0?(b.price-unit)*per:null};
}
function bpcClass(pc){ if(pc==null) return "none"; const t=S.settings.beerTarget; return pc<=t?"ok":pc<=t+5?"warn":"bad"; }
function bUnits(b,e){ return e ? (e.cases||0)*bcalc(b).per + (e.loose||0) : null; }
function bEntry(c,id){ return c && c.beer ? c.beer[id] : null; }
const bPack = b => `${bcalc(b).per} × ${+(+b.oz||12).toFixed(1)} oz ${(b.pkg||"Can").toLowerCase()}s`;
const bCases = (b,u) => { const per=bcalc(b).per, cs=Math.floor(u/per), l=u-cs*per; return `${cs} case${cs===1?"":"s"}${l?` + ${l}`:""}`; };

  rows.sort((a,b)=>(b.vCost??-1e9)-(a.vCost??-1e9)||(b.usedCost||0)-(a.usedCost||0)).forEach(r=>{
    const cls = r.v==null?"":r.v>2?"bad":r.v>0?"warn":"ok", nm = r.b.pkg==="Bottle"?"btl":"cans";
    const meta = r.used==null ? "Not counted this time" : `Used ${r.used} ${nm}${r.recv?` · +${r.recv} case${r.recv>1?"s":""} recv`:""}${r.sold!=null?` · ${r.sold} sold`:""}`;

  });

  st.products.forEach((p,i)=>{

    const used = sold*p.pour*(1+vars[i]);
    let tot = 2*bo+open0+recv*bo-used; tot = Math.max(tot,0);
    const sealed = Math.max(0,Math.floor(tot/bo)-(tot%bo<.5?1:0)), open = tot-sealed*bo;
    if(i!==14) b.items[p.id] = {sealed,open:+open.toFixed(2),method:"scale",raw:Math.round(p.tare+open*OZ*d)};

    ["Modelo Especial","Import","Can",24,33.99,6],["Corona Extra","Import","Bottle",24,34.99,6],["Dos Equis Lager","Import","Bottle",24,32.99,6],
    ["Shiner Bock","Craft","Bottle",24,31.99,5.5],["Lagunitas IPA","Craft","Can",24,38.99,6.5],["White Claw Black Cherry","Seltzer","Can",24,36.99,6]];
  st.beers = B.map(([name,type,pkg,per,caseCost,price],i)=>({id:uid(),name,type,pkg,oz:12,per,caseCost,price,par:type==="Domestic"?6:3,vendor:type==="Domestic"||type==="Seltzer"?"Beer Distributor 1":"Beer Distributor 2"}));
  const miss=[2,0,1,0,3,1,0,0,4,1];
  a.beer={}; b.beer={}; b.beerRecv={}; b.beerSold={}; a.beerRecv={}; a.beerSold={};
  st.beers.forEach((x,i)=>{
    const start = (x.type==="Domestic"?5:2)*x.per + ((i*7)%x.per);
    a.beer[x.id] = {cases:Math.floor(start/x.per), loose:start%x.per};
    const recv = x.type==="Domestic"?2:i%2, sold = Math.min(40+((i*23)%55), start+recv*x.per-miss[i]-9);

  });
  return st;
}

document.addEventListener("click",e=>{
  const b = e.target.closest(".btl[data-id]");
  if(b){ if(suppressClick) return; const id=b.dataset.id; if(arranging) bottleMenu(id); else if(b.dataset.mode==="count") countSheet(id); else productSheet(prod(id)); return; }

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.t){ if(canManage()){ S.settings[t.dataset.t]=t.value.slice(0,60); save(); } return; }
  if(t.id==="q"){ query=t.value; $("#plist").innerHTML=productList(); return; }

  if(t.closest("#sheetIn")){ dirty=true; if(edit) updatePreview(); else if(bedit) beerPreview(); else if(bct) beerCountTotal(); else if(ct && $("#gauge")) updateGauge(); }
  if(t.dataset.s && canManage()){ const v=num(t.value); if(v>0){ S.settings[t.dataset.s]=/target|Target/.test(t.dataset.s)?clamp(v,1,100):v; save(); } }

document.addEventListener("focusin",e=>{ const t=e.target; if(t.tagName==="INPUT" && t.getAttribute("inputmode") && t.value) setTimeout(()=>{ try{ t.select(); }catch(_){} },0); });
